name: Audit original window shader source once
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  shader-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified original project recovery privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38582072502 --repo "$GITHUB_REPOSITORY" --name crisis-response-recovery-direct-v3-1 --dir work/recovery
      - name: Inspect exact source shaders and record provenance
        run: |
          python3 scripts/audit_original_window_shaders.py work/recovery/export/ExportedProject --out work/shader-audit/window-shaders.json
          git rev-parse HEAD > work/shader-audit/workflow-commit.txt
      - name: Save private metadata report, not original source code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-window-shader-source-audit
          path: |
            work/shader-audit/window-shaders.json
            work/shader-audit/workflow-commit.txt
          retention-days: 30
          if-no-files-found: warn
