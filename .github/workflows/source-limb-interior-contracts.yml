name: Original projectile limb interior source native contracts
# Test real author Torso density projectile penetration, source cavity and blood volume, plus marksman skin depth.
on:
  push:
    branches: [feature/original-projectile-limb-hit-runtime]
    paths:
      - .github/workflows/source-limb-interior-contracts.yml
      - runtime/Original/Weapons/CharacterLimbBallisticMethods.cs
      - runtime/Checks/ProjectileInjuryContracts.cs
      - runtime/Engine/OriginalArmPhysicsHost.cs
      - runtime/Checks/BallisticContracts.cs
      - runtime/Original/OriginalMuscleControl.cs
      - runtime/Original/CharacterVitalDynamics.cs
      - runtime/Original/OriginalVitalFunctions.cs
      - runtime/Original/Weapons/OriginalCharacterVitalHost.cs
      - runtime/Original/Weapons/CharacterLimbRagdollState.cs
      - runtime/Checks/OriginalMuscleControlContracts.cs
      - runtime/Original/Weapons/OriginalOccupantPrefab.cs
      - runtime/Checks/OriginalOccupantPrefabContracts.cs
      - runtime/Original/Weapons/OriginalMissionHitEffects.cs
      - runtime/Checks/OriginalMissionHitContracts.cs
      - runtime/Original/OriginalLimbDamageGeometry.cs
      - runtime/Checks/OriginalLimbDamageGeometryContracts.cs
      - runtime/Checks/Program.cs
permissions:
  contents: read
jobs:
  original-limb:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - name: Run selected original Limb material and wound source contracts
        run: |
          cp tools/wasm-compile/global.json global.json
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --projectile-injury-chain
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --source-limb-interior
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --source-tissue-penetration
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-systems
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --source-muscle-control
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --source-occupant-prefab
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --original-mission-hit
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --original-limb-decal-geometry
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj
