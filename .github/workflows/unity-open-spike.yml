name: Unity 2022.3 import go-no-go spike

on:
  push:
    paths:
      - ".github/workflows/unity-open-spike.yml"
      - "scripts/unity_open_spike.sh"
      - "scripts/classify_unity_spike.py"
      - "scripts/report_unity_spike.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: unity-open-spike
  cancel-in-progress: false

jobs:
  unity-open-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout code only, no recovered proprietary assets
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: License Personal seat and diagnose recovered project (read existing private release only)
        run: bash scripts/unity_open_spike.sh
      - name: Emergency return Personal seat if interrupted
        if: always()
        run: |
          ID="crisis-unity-personal-$GITHUB_RUN_ID"
          if docker ps --format '{{.Names}}' | grep -Fxq "$ID"; then
            timeout 100 docker exec "$ID" /bin/bash -lc '\n              c="$(command -v Unity.Licensing.Client || find /opt/unity -name Unity.Licensing.Client -type f -print -quit)"\n              test -n "$c" && "$c" --return-ulf\n            ' > /tmp/unity-emergency-return.log 2>&1 || true
            docker rm -f "$ID" >/dev/null 2>&1 || true
            echo 'Emergency license return attempted; verify Unity ID seat state if import was cancelled.'
          fi
      - name: Classify actual logs, preserving unknowns when Unity never started
        if: always()
        run: |
          mkdir -p work/unity-spike docs
          python3 scripts/classify_unity_spike.py \
            --log work/unity-spike/import.log \
            --build-log work/unity-spike/webgl.log \
            --status-file work/unity-spike/status.env \
            --out work/unity-spike/classification.json
          python3 scripts/report_unity_spike.py \
            --classification work/unity-spike/classification.json \
            --out docs/UNITY_OPEN_SPIKE_2026-10-15.md
      - name: Upload classified report and full Unity/docker logs, not original game binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-2022-personal-open-spike-evidence
          path: |
            work/unity-spike/*.log
            work/unity-spike/*.json
            work/unity-spike/*.txt
            work/unity-spike/*.env
            docs/UNITY_OPEN_SPIKE_2026-10-15.md
          if-no-files-found: warn
          retention-days: 30
      - name: Commit evidence-only go-no-go report
        if: always()
        run: |
          test -s docs/UNITY_OPEN_SPIKE_2026-10-15.md || exit 0
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/UNITY_OPEN_SPIKE_2026-10-15.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record Unity 2022.3 open spike findings and log evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
