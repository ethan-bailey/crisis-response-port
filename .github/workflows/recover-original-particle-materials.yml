name: Recover source-original particle material properties for private WASM
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
jobs:
  material-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore original verified private Unity project
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38582072502 --repo "$GITHUB_REPOSITORY" --name crisis-response-recovery-direct-v3-1 --dir work/recovery
      - name: Validate eight native materials and four original browser textures
        run: |
          set -euo pipefail
          mkdir -p work/particle-materials
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/audit_original_particle_mesh_materials.py \
            work/recovery/export/ExportedProject \
            --manifest game/assets/ballistics/original-particles-source.json.gz \
            --out work/particle-materials/source-provenance.json | tee work/particle-materials/source-audit.log
          python3 scripts/export_original_particle_materials.py \
            work/recovery/export/ExportedProject \
            --audit work/particle-materials/source-provenance.json \
            --particle-manifest game/assets/ballistics/original-particles-source.json.gz \
            --out work/particle-materials/original-particle-materials-source.json.gz | tee work/particle-materials/summary.json
          python3 - <<'PY'
          import gzip,json,hashlib
          p='work/particle-materials/original-particle-materials-source.json.gz'
          raw=open(p,'rb').read();payload=json.loads(gzip.decompress(raw))
          assert len(payload['materials'])==8
          assert len(payload['textures'])==4
          assert len(payload['shaders'])==2
          assert set(payload['effectsByMaterial'])==set(payload['materials'])
          assert payload['shaders']['0000000000000000f000000000000000']['unresolvedEngineShader']
          print('Source material SHA256',hashlib.sha256(raw).hexdigest())
          print('No shader semantics were synthesized.')
          PY
          sha256sum work/particle-materials/original-particle-materials-source.json.gz > work/particle-materials/manifest-sha256.txt
          git rev-parse HEAD > work/particle-materials/input-commit.txt
      - name: Commit original verified material source to private branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/projectile-material-impacts"
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate -q .isPrivate)" = "true"
          remote_sha="$(git ls-remote origin refs/heads/codex/projectile-material-impacts | awk '{print $1}')"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Concurrent branch advancement: do not overwrite; preserve artifact for next session."
            exit 0
          fi
          cp work/particle-materials/original-particle-materials-source.json.gz \
             game/assets/ballistics/original-particle-materials-source.json.gz
          git add game/assets/ballistics/original-particle-materials-source.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Crisis Port Source Recovery" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Preserve eight original particle material sources and texture SHA mappings (no shader substitution)"
          git push origin HEAD:refs/heads/codex/projectile-material-impacts
          git rev-parse HEAD > work/particle-materials/committed-sha.txt
      - name: Save source SHA and private rollback metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-original-impact-particle-materials
          path: work/particle-materials/
          retention-days: 30
          if-no-files-found: warn
