name: Recover authentic CharacterBody dependency scripts
on:
  push:
    branches: [feature/full-source-characterbody-integration]
    paths: [.github/workflows/recover-characterbody-dependencies.yml]
permissions:
  actions: read
  contents: write
jobs:
  recover-original-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Obtain pinned private recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11903811738/zip" > /tmp/original-recovery.zip
          echo 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  /tmp/original-recovery.zip' | sha256sum -c -
      - name: Extract unchanged developer sources by exact filename
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,json
          names = """
          Mission Communication WeaponAimer MuscleControl CharacterDialog Grenade
          CharacterScoreCard CharacterAudio AudioSurface Target Room Physiology LimbId
          Emitter SerializableExtraSettings DialogTree SerializableEquipment
          ArmorClass WeaponMode FloorStreakPainter IKArmController TimeScaler
          DynamicInteractionMarker Settings DoorController BallisticObstacle
          WeaponBase Limb ArmsControl TeamOperator PlayerController CapsuleCollider
          Animator SpringJoint Collision
          """.split()
          archive=zipfile.ZipFile('/tmp/original-recovery.zip')
          root=pathlib.Path('source-reference/Original/CharacterDependencies')
          root.mkdir(parents=True,exist_ok=True)
          available={p.split('/')[-1]:p for p in archive.namelist() if p.endswith('.cs') and '/Assembly-CSharp/' in p}
          extracted={};missing=[]
          for name in names:
            entry=available.get(name+'.cs')
            if not entry:
              missing.append(name)
              continue
            content=archive.read(entry)
            out=root/(name+'.cs')
            out.write_bytes(content)
            extracted[name]={'archiveEntry':entry,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()}
          (root/'recovery-manifest.json').write_text(json.dumps({'archiveSha256':'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d','scripts':extracted,'missing':missing},indent=2,sort_keys=True)+'\n')
          print('Recovered',len(extracted),'original scripts. Missing:',missing)
          assert len(extracted) >= 5, 'Unexpected archive structure; do not commit incomplete guess'
          PY
      - name: Commit only SHA-backed original reference source
        run: |
          git add source-reference/Original/CharacterDependencies
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "Preserve recovered original CharacterBody dependencies with per-script SHA256"
            git push origin HEAD:feature/full-source-characterbody-integration
          fi
