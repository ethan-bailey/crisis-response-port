name: Verify source-backed WASM continuation once

# Deliberately scoped to editing this workflow itself: normal game/C# commits
# must not launch expensive jobs. workflow_dispatch remains available later.
on:
  push:
    branches:
      - codex/projectile-material-impacts
    paths:
      - ".github/workflows/wasm-continuation-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-source-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact input commit for rollback
        run: |
          mkdir -p work/wasm-verification
          git rev-parse HEAD | tee work/wasm-verification/source-commit.txt
      - name: Run recovered original C# contracts with WASM adapters
        run: |
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj | tee work/wasm-verification/native-contracts.jsonl
      - name: Validate browser adapter syntax and simulation-clock regressions
        run: |
          node --check game/source-effect-clock.mjs
          node --check game/weapon-runtime.mjs
          node --check game/presentation.mjs
          node --check game/original-impact-mesh.mjs
          node --test scripts/source_effect_clock_test.mjs | tee work/wasm-verification/source-clock-tests.txt
      - name: Compile source-backed Blazor WebAssembly runtime
        run: |
          cp game/browser-input.mjs runtime/Browser/wwwroot/browser-input.mjs
          dotnet publish runtime/Browser/Crisis.Runtime.Browser.csproj -c Release -o work/wasm-verification/published | tee work/wasm-verification/publish-log.txt
          find work/wasm-verification/published/wwwroot -name '*.wasm' -type f | tee work/wasm-verification/wasm-files.txt
          test -s work/wasm-verification/wasm-files.txt
          test -f work/wasm-verification/published/wwwroot/index.html
      - name: Store metadata and logs without recovered binary assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-wasm-continuation-verification
          path: |
            work/wasm-verification/source-commit.txt
            work/wasm-verification/native-contracts.jsonl
            work/wasm-verification/source-clock-tests.txt
            work/wasm-verification/publish-log.txt
            work/wasm-verification/wasm-files.txt
          retention-days: 30
          if-no-files-found: warn
