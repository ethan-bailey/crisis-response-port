name: Verify original raw YAML normal-sign bits for particle meshes
on:
  push:
    branches:
      - codex/projectile-material-impacts
    paths:
      - .github/workflows/recover-original-particle-meshes.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  particle-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore verified private original Unity project
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38582072502 --repo "$GITHUB_REPOSITORY" --name crisis-response-recovery-direct-v3-1 --dir work/recovery
      - name: Decode exact three Unity source meshes and verify their original hashes
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.2
          mkdir -p work/particle-geometry
          python3 scripts/extract_original_particle_meshes.py \
            work/recovery/export/ExportedProject \
            --out-dir work/particle-geometry/meshes | tee work/particle-geometry/report.json
          python3 - <<'PY'
          import glob,json
          files=glob.glob('work/particle-geometry/meshes/particle-mesh-*.json')
          assert len(files)==3, f"Expected three original source meshes: {files}"
          for path in files:
              x=json.load(open(path))
              assert x['sourceGuid'] in path
              assert len(x['mesh']['positions'])==x['count']['vertices']
              assert len(x['mesh']['indices'])==3*x['count']['triangles']
              assert 'already converted to right-handed' in x['sourceFormat']
          print('All three source mesh buffers/IDs passed provenance checks.')
          PY
          mkdir -p game/assets/ballistics/particle-meshes
          cp work/particle-geometry/meshes/particle-mesh-*.json game/assets/ballistics/particle-meshes/
          node --test scripts/original_particle_mesh_source_test.mjs
          git rev-parse HEAD > work/particle-geometry/input-commit.txt
      - name: Safely add only original mesh JSON to the isolated private PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/projectile-material-impacts"
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate -q .isPrivate)" = "true"
          remote_sha="$(git ls-remote origin refs/heads/codex/projectile-material-impacts | awk '{print $1}')"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced: keep artifact only, never overwrite another worker."
            exit 0
          fi
          mkdir -p game/assets/ballistics/particle-meshes
          cp work/particle-geometry/meshes/particle-mesh-*.json game/assets/ballistics/particle-meshes/
          git add game/assets/ballistics/particle-meshes/
          if git diff --cached --quiet; then
            echo "Identical original source meshes already preserved."
            exit 0
          fi
          git -c user.name="Crisis Port Source Recovery" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Preserve exact original impact particle meshes for source-backed WASM presentation"
          git push origin HEAD:refs/heads/codex/projectile-material-impacts
          git rev-parse HEAD > work/particle-geometry/committed-sha.txt
      - name: Archive original mesh hashes/vertices and exact rollback commits privately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-original-impact-particle-meshes
          path: work/particle-geometry/
          retention-days: 30
          if-no-files-found: warn
