name: Compile recovered full CharacterBody dependency closure
# Gate 0 focused compiler refresh after the ArmController alias repair.
# Expected to expose remaining authentic game/Unity/Behavior Designer dependencies;
# a failed closure run is evidence, not a reason to substitute source methods.
on:
  push:
    branches: [feature/full-source-characterbody-integration]
    paths:
      - '.github/workflows/characterbody-full-compile.yml'
      - 'runtime/Original/CharacterBody.Full.cs'
      - 'runtime/Original/Animation/ArmController.cs'
      - 'runtime/Engine/**'
      - 'runtime/Original/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - name: Verify exact original CharacterBody enum identities
        run: python3 scripts/verify_full_characterbody_enums.py
      - name: Compile all source lines and preserve missing dependencies
        run: |
          cp tools/wasm-compile/global.json global.json
          dotnet build runtime/Crisis.Runtime.csproj -v:q -p:GenerateDocumentationFile=false > characterbody-compile.log 2>&1 || {
            cat characterbody-compile.log | tail -250
            exit 1
          }
      - name: Record exact compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterbody-full-compiler-diagnostics
          path: characterbody-compile.log
          retention-days: 14
          if-no-files-found: warn
