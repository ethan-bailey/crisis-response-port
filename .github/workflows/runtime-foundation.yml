name: Execute recovered original code with runtime services
on:
  push:
    paths:
      - "runtime/**"
      - "scripts/extract_runtime_sources.py"
      - "scripts/extract_runtime_scene.py"
      - "scripts/runtime_wasm_smoke.mjs"
      - ".github/workflows/runtime-foundation.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified original project recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38582072502 --repo "$GITHUB_REPOSITORY" --name crisis-response-recovery-direct-v3-1 --dir work/recovery
      - name: Extract complete serialized fields and source-selected methods
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/extract_runtime_sources.py work/recovery/export/ExportedProject runtime/Original
          python3 scripts/extract_runtime_scene.py work/recovery/export/ExportedProject work/runtime/scene-package.json
      - name: Compile and test runtime against original components and scenes
        run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- work/runtime/scene-package.json > work/runtime/contracts-and-scenes.jsonl
      - name: Build original-code browser runtime
        run: |
          cp game/browser-input.mjs runtime/Browser/wwwroot/browser-input.mjs
          dotnet publish runtime/Browser/Crisis.Runtime.Browser.csproj -c Release -o work/runtime/published
      - name: Install browser verification engines
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Execute original methods and original scene graph in WebAssembly
        run: |
          python3 -m http.server 8000 --directory work/runtime/published/wwwroot >/tmp/crisis-runtime-http.log 2>&1 &
          node scripts/runtime_wasm_smoke.mjs
      - name: Save private runtime build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-original-runtime-foundation
          path: |
            work/runtime/
            runtime/Original/
            runtime-wasm-smoke.json
            runtime-chromium.png
            runtime-webkit.png
          retention-days: 30
          if-no-files-found: warn
