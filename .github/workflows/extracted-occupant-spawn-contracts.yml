name: Extracted original Occupant spawn source contracts
on:
  pull_request:
    branches: [develop/wasm]
    paths:
      - 'game/source-occupant-spawner.mjs'
      - 'game/source-occupant-sandbox-settings.mjs'
      - 'game/assets/occupant/source-visual-spawn.json'
      - 'scripts/test_original_occupant_spawn.mjs'
      - 'scripts/test_original_occupant_sandbox_settings.mjs'
      - '.github/workflows/extracted-occupant-spawn-contracts.yml'
permissions:
  contents: read
jobs:
  source-spawner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify original author spawn-area and sandbox conversion contracts
        run: |
          node scripts/test_original_occupant_spawn.mjs
          node scripts/test_original_occupant_sandbox_settings.mjs
