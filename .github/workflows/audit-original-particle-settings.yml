name: Audit native original particle system settings once
on:
  push:
    branches:
      - codex/projectile-material-impacts
    paths:
      - .github/workflows/audit-original-particle-settings.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  particle-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified original private recovered project
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38582072502 --repo "$GITHUB_REPOSITORY" --name crisis-response-recovery-direct-v3-1 --dir work/recovery
      - name: Extract original serialized particle modules and renderer fields
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/audit_original_particle_sources.py work/recovery/export/ExportedProject --out work/particle-audit/source-particle-components.json
          git rev-parse HEAD > work/particle-audit/workflow-commit.txt
      - name: Store source particle components privately for future porting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-native-particle-components
          path: |
            work/particle-audit/source-particle-components.json
            work/particle-audit/workflow-commit.txt
          retention-days: 30
          if-no-files-found: warn
