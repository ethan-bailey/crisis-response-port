name: Verify original limb material armor and physics source
# Recheck original Unity Random and LimbArmor namespace aliases without rewriting authored damage formulas.
on:
  push:
    branches: [feature/original-projectile-limb-material-closure]
    paths: [.github/workflows/source-limb-ballistic-contracts.yml]
permissions:
  contents: read
jobs:
  authentic-limb-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Select the recovered runtime SDK
        run: cp tools/wasm-compile/global.json global.json
      - name: Verify all authored ballistic materials and collider records
        run: |
          node --test scripts/original_limb_ballistics_source_test.mjs
          node --test scripts/full_character_source_graph_test.mjs
      - name: Compile unchanged ArmorClass and LimbArmor with source character contracts
        run: |
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-systems
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-dependencies
