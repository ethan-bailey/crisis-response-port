name: Original organ trauma native source contracts
# Test the author's exact source Hermite curve interpolation, including its deliberate overshoot.
on:
  push:
    branches: [feature/live-character-limb-ballistic-damage]
    paths: [.github/workflows/original-organ-trauma-contract.yml]
permissions: {contents: read}
jobs:
  vital-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - name: Original native physiology and limb organ hit contracts
        run: |
          cp tools/wasm-compile/global.json global.json
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-systems
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-dependencies
      - name: Source preservation and no surrogate hit claims
        run: |
          python3 - <<'PY'
          import json,hashlib
          p='source-reference/Original/ProjectileInteractions/provenance.json'
          j=json.load(open(p))
          assert j['archiveSha256']=='cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d'
          for name,entry in j['sources'].items():
            data=open('source-reference/Original/ProjectileInteractions/'+name,'rb').read()
            assert hashlib.sha256(data).hexdigest()==entry['sha256'],name
          anatomy=json.load(open('game/assets/original-character-limb-components.json'))
          assert [sum('VitalFunctions' in x['sourceFields'] for x in c['limbs']) for c in anatomy['characters']]==[9,9]
          print('Recovered original projectile source and 9 authentic organ groups verified')
          PY
