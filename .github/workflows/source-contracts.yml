name: Source contracts and WASM build

on:
  push:
    branches: [develop/wasm]
    paths:
      - .github/workflows/source-contracts.yml
      - global.json
      - Directory.*
      - runtime/**
      - game/**
      - scripts/**
      - scene-data/**
      - source-reference/Original/**
      - NuGet.config
      - requirements-test.txt
      - '**/*.sln'
      - '**/*.csproj'
  pull_request:
    branches: [develop/wasm]
    paths:
      - .github/workflows/source-contracts.yml
      - global.json
      - Directory.*
      - runtime/**
      - game/**
      - scripts/**
      - NuGet.config
      - '**/*.sln'
      - '**/*.csproj'
      - scene-data/**
      - source-reference/Original/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts and Release WASM publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Assert toolchain versions
        shell: bash
        run: |
          test "$(dotnet --version)" = "8.0.426"
          node --version
          python --version

      - name: Install and vendor pinned browser physics runtime
        run: |
          npm ci --prefix game --ignore-scripts
          npm run --prefix game vendor

      - name: Install pinned Python test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run Node contracts
        run: node --test scripts/*_test.mjs scripts/*_contracts.mjs

      - name: Run Python contracts
        run: python -m unittest discover -s scripts -p '*test.py'

      - name: Run runtime contracts
        run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -c Release

      - name: Run engine checks
        run: dotnet run --project runtime/EngineChecks/Crisis.Runtime.EngineChecks.csproj -c Release

      - name: Run foundation checks
        run: dotnet run --project runtime/FoundationChecks/Crisis.Runtime.FoundationChecks.csproj -c Release

      - name: Build source runtime
        run: dotnet build runtime/Crisis.Runtime.csproj -c Release --no-incremental

      - name: Publish browser WebAssembly runtime
        run: dotnet publish runtime/Browser/Crisis.Runtime.Browser.csproj -c Release -o "$RUNNER_TEMP/cpr-browser-publish"

      - name: Verify browser publish output
        shell: bash
        run: |
          root="$RUNNER_TEMP/cpr-browser-publish/wwwroot"
          test -s "$root/index.html"
          test -s "$root/browser-input.mjs"
          find "$root" -type f -name '*.wasm' -print -quit | grep -q .

      - name: Build and independently verify full Mission Site package
        shell: bash
        run: |
          set -euo pipefail
          printf '{"dotnet":"8.0.426"}\n' > "$RUNNER_TEMP/cpr-toolchain.json"
          python3 scripts/package_wasm_site.py build \
            --repo "$GITHUB_WORKSPACE" \
            --published "$RUNNER_TEMP/cpr-browser-publish/wwwroot" \
            --output "$RUNNER_TEMP/cpr-site-package" \
            --toolchain "$RUNNER_TEMP/cpr-toolchain.json" \
            --incremental-source-package "$GITHUB_WORKSPACE/scene-data/crisis-response-scenes.json.gz" \
            --incremental-profile global-ui-mission-operator \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | tee "$RUNNER_TEMP/cpr-package-build.json"
          python3 - "$RUNNER_TEMP/cpr-site-package/scene-data/fullsource/global-ui-mission-operator/manifest.json" "$GITHUB_WORKSPACE/scene-data/crisis-response-scenes.json.gz" <<'PY'
          import hashlib, json, sys
          profile = json.load(open(sys.argv[1], encoding="utf-8"))
          archive = open(sys.argv[2], "rb").read()
          expected = hashlib.sha256(archive).hexdigest()
          if profile.get("profile") != "global-ui-mission-operator":
              raise SystemExit("generated Mission source profile has the wrong identity")
          if profile.get("sourcePackageSha256") != expected:
              raise SystemExit("generated Mission profile does not identify the tracked source archive")
          if profile.get("assetCount", 0) < len(profile.get("rootAssets", [])):
              raise SystemExit("generated Mission profile is incomplete")
          print(f"Mission source profile: {profile['assetCount']} assets; source archive SHA-256 {expected}")
          PY
          python3 scripts/package_wasm_site.py verify "$RUNNER_TEMP/cpr-site-package" \
            | tee "$RUNNER_TEMP/cpr-package-verify.json"
          python3 - "$RUNNER_TEMP/cpr-site-package/build-manifest.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if manifest["sourceCommit"] != sys.argv[2]:
              raise SystemExit(f"package source {manifest['sourceCommit']} != workflow SHA {sys.argv[2]}")
          if manifest.get("scope", {}).get("originalGameComplete") is not False:
              raise SystemExit("package parity scope must remain explicitly incomplete")
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/cpr-site-package.tar" -C "$RUNNER_TEMP/cpr-site-package" .
          gzip -n -6 "$RUNNER_TEMP/cpr-site-package.tar"
          archive_sha="$(sha256sum "$RUNNER_TEMP/cpr-site-package.tar.gz" | cut -d' ' -f1)"
          package_files="$(find "$RUNNER_TEMP/cpr-site-package" -type f | wc -l | tr -d ' ')"
          printf '\n### Full Mission Site package\n\n- Source SHA: `%s`\n- Package files (including build manifest): `%s`\n- Deterministic tar.gz SHA-256: `%s`\n- Build result: `%s`\n- Independent verify: `%s`\n' \
            "$GITHUB_SHA" "$package_files" "$archive_sha" \
            "$(cat "$RUNNER_TEMP/cpr-package-build.json")" \
            "$(cat "$RUNNER_TEMP/cpr-package-verify.json")" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact Mission Site package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crisis-response-site-${{ github.sha }}
          path: ${{ runner.temp }}/cpr-site-package.tar.gz
          if-no-files-found: error
          retention-days: 14

  indexeddb-browser:
    name: Chromium IndexedDB cache acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install pinned browser-test dependency
        run: npm ci --prefix game --ignore-scripts

      - name: Install Chromium
        run: game/node_modules/.bin/playwright install --with-deps chromium

      - name: Exercise production loader with browser IndexedDB
        run: node scripts/indexeddb_browser_smoke.mjs
