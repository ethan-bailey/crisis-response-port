name: Source contracts and WASM build

on:
  push:
    branches: [develop/wasm]
    paths:
      - .github/workflows/source-contracts.yml
      - global.json
      - Directory.*
      - runtime/**
      - game/**
      - scripts/**
      - scene-data/**
      - source-reference/Original/**
      - NuGet.config
      - requirements-test.txt
      - '**/*.sln'
      - '**/*.csproj'
  pull_request:
    branches: [develop/wasm]
    paths:
      - .github/workflows/source-contracts.yml
      - global.json
      - Directory.*
      - runtime/**
      - game/**
      - scripts/**
      - NuGet.config
      - '**/*.sln'
      - '**/*.csproj'
      - scene-data/**
      - source-reference/Original/**
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: source-wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts and Release WASM publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.426

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Assert toolchain versions
        shell: bash
        run: |
          test "$(dotnet --version)" = "8.0.426"
          node --version
          python --version

      - name: Install and vendor pinned browser physics runtime
        run: |
          npm ci --prefix game --ignore-scripts
          npm run --prefix game vendor

      - name: Install pinned Python test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run Node contracts
        run: node --test scripts/*_test.mjs scripts/*_contracts.mjs

      - name: Run Python contracts
        run: python -m unittest discover -s scripts -p '*test.py'

      - name: Run runtime contracts
        run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -c Release

      - name: Run engine checks
        run: dotnet run --project runtime/EngineChecks/Crisis.Runtime.EngineChecks.csproj -c Release

      - name: Run foundation checks
        run: dotnet run --project runtime/FoundationChecks/Crisis.Runtime.FoundationChecks.csproj -c Release

      - name: Build source runtime
        run: dotnet build runtime/Crisis.Runtime.csproj -c Release --no-incremental

      - name: Publish browser WebAssembly runtime
        run: dotnet publish runtime/Browser/Crisis.Runtime.Browser.csproj -c Release -o "$RUNNER_TEMP/cpr-browser-publish"

      - name: Verify browser publish output
        shell: bash
        run: |
          root="$RUNNER_TEMP/cpr-browser-publish/wwwroot"
          test -s "$root/index.html"
          test -s "$root/browser-input.mjs"
          find "$root" -type f -name '*.wasm' -print -quit | grep -q .

      - name: Select a verified Unity source snapshot
        id: recovery-input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100', headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as response:
              artifacts = json.load(response)['artifacts']
          candidates = [a for a in artifacts if a['name'].startswith('cpr-recovered-unity-project-') and not a.get('expired', True)]
          if candidates:
              selected = max(candidates, key=lambda a: a['created_at'])
              created = datetime.datetime.fromisoformat(selected['created_at'].replace('Z', '+00:00'))
              refresh = (datetime.datetime.now(datetime.timezone.utc) - created).days >= 60
              values = {'artifact_id':str(selected['id']),'run_id':str(selected['workflow_run']['id']),'name':selected['name'],'is_seed':'false','refresh':str(refresh).lower()}
          else:
              values = {'artifact_id':'11903811738','run_id':'38582072502','name':'crisis-response-recovery-direct-v3-1','is_seed':'true','refresh':'true'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,value in values.items():
                  print(f'{key}={value}',file=output)
          print(f"Selected {values['name']} from run {values['run_id']}; refresh={values['refresh']}")
          PY

      - name: Download the selected Unity source snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.recovery-input.outputs.name }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.recovery-input.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/recovery-artifact

      - name: Verify recovered source and generate full source index
        id: recovered-source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARTIFACT_ID: ${{ steps.recovery-input.outputs.artifact_id }}
          INPUT_IS_SEED: ${{ steps.recovery-input.outputs.is_seed }}
          REFRESH_SOURCE: ${{ steps.recovery-input.outputs.refresh }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/recovery-artifact"
          if [ "$INPUT_IS_SEED" = true ]; then
            curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID" > "$RUNNER_TEMP/recovery-artifact-metadata.json"
            python3 - "$RUNNER_TEMP/recovery-artifact-metadata.json" <<'PY'
          import json, sys
          artifact = json.load(open(sys.argv[1], encoding='utf-8'))
          if artifact.get('id') != 11903811738 or artifact.get('expired') or artifact.get('digest') != 'sha256:cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d':
              raise SystemExit('pinned original recovery artifact identity, digest, or retention state is invalid')
          PY
            printf '{"artifactId":11903811738,"runId":38582072502,"artifactSha256":"cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d"}\n' > "$recovery_root/recovery-provenance.json"
            (cd "$recovery_root" && find . -type f ! -name RECOVERY_CONTENTS_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > RECOVERY_CONTENTS_SHA256SUMS.txt)
          else
            test -s "$recovery_root/recovery-provenance.json"
            test -s "$recovery_root/RECOVERY_CONTENTS_SHA256SUMS.txt"
            (cd "$recovery_root" && sha256sum -c RECOVERY_CONTENTS_SHA256SUMS.txt)
            python3 - "$recovery_root/recovery-provenance.json" <<'PY'
          import json, sys
          provenance = json.load(open(sys.argv[1], encoding='utf-8'))
          if provenance.get('artifactSha256') != 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d':
              raise SystemExit('refreshed Unity source snapshot lost canonical recovery provenance')
          PY
          fi
          project="$recovery_root/export/ExportedProject"
          test -s "$project/Assets/Scenes/Mission 01.unity"
          test -s "$project/Assets/Resources/Global context.prefab"
          test -s "$project/Assets/Resources/Version.prefab"
          test -s "$project/Assets/Mesh/LowPolySphere.asset"
          test -s "$project/Assets/Material/Projectile trace.mat"
          test -s "$project/Assets/Resources/weapons/ammunition/5.56-FMJ-Tracer.prefab"
          python3 scripts/extract_runtime_scene.py "$project" "$RUNNER_TEMP/cpr-full-source.json"
          echo "recovery_sha256=cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d" >> "$GITHUB_OUTPUT"
          echo "source_index_sha256=$(sha256sum "$RUNNER_TEMP/cpr-full-source.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Refresh verified Unity source snapshot
        if: steps.recovery-input.outputs.refresh == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpr-recovered-unity-project-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Build and verify complete Mission source package
        shell: bash
        env:
          RECOVERY_SHA256: ${{ steps.recovered-source.outputs.recovery_sha256 }}
          SOURCE_INDEX_SHA256: ${{ steps.recovered-source.outputs.source_index_sha256 }}
        run: |
          set -euo pipefail
          printf '{"dotnet":"8.0.426","recoveryArchiveSha256":"%s","sourceIndexSha256":"%s"}\\n' "$RECOVERY_SHA256" "$SOURCE_INDEX_SHA256" > "$RUNNER_TEMP/cpr-toolchain.json"
          python3 scripts/package_wasm_site.py build --repo "$GITHUB_WORKSPACE" --published "$RUNNER_TEMP/cpr-browser-publish/wwwroot" --output "$RUNNER_TEMP/cpr-site-package" --toolchain "$RUNNER_TEMP/cpr-toolchain.json" --incremental-source-package "$RUNNER_TEMP/cpr-full-source.json" --incremental-profile global-ui-mission-operator --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee "$RUNNER_TEMP/cpr-package-build.json"
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -c Release -- --mission-ui-incremental-contract "$RUNNER_TEMP/cpr-site-package/scene-data/fullsource/global-ui-mission-operator"
          python3 - "$RUNNER_TEMP/cpr-site-package/scene-data/fullsource/global-ui-mission-operator/manifest.json" "$RUNNER_TEMP/cpr-full-source.json" "$RUNNER_TEMP/cpr-toolchain.json" <<'PY'
          import hashlib, json, sys
          profile = json.load(open(sys.argv[1], encoding="utf-8"))
          source_index = open(sys.argv[2], "rb").read()
          provenance = json.load(open(sys.argv[3], encoding="utf-8"))
          expected_roots = [
              "Assets/Resources/Global context.prefab",
              "Assets/GameObject/Interior mode UI.prefab",
              "Assets/Resources/ui/Interaction menu.prefab",
              "Assets/Resources/characters/Operator.prefab",
              "Assets/Resources/Version.prefab",
              "Assets/Scenes/Mission 01.unity",
          ]
          checks = {
              "profile": profile.get("profile") == "global-ui-mission-operator",
              "roots": profile.get("rootAssets") == expected_roots,
              "source index identity": profile.get("sourcePackageSha256") == hashlib.sha256(source_index).hexdigest() == provenance.get("sourceIndexSha256"),
              "recovery provenance": provenance.get("recoveryArchiveSha256") == "cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d",
              "asset count": profile.get("assetCount") == 1919,
              "record count": profile.get("recordCount") == 22365,
              "compressed bytes": profile.get("compressedAssetBytes") == 97767549,
              "source bytes": profile.get("uncompressedAssetBytes") == 205514345,
              "maximum source asset": profile.get("maximumAssetBytes") == 14858177,
          }
          failures = [name for name, ok in checks.items() if not ok]
          if failures:
              raise SystemExit("full Mission profile invariant failed: " + ", ".join(failures))
          print("Full six-root Mission profile: 1,919 assets, 22,365 records, 97,767,549 compressed asset bytes, 205,514,345 source bytes; source index and recovery archive identities verified.")
          PY
          python3 scripts/package_wasm_site.py verify "$RUNNER_TEMP/cpr-site-package" | tee "$RUNNER_TEMP/cpr-package-verify.json"
          python3 - "$RUNNER_TEMP/cpr-site-package/build-manifest.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if manifest["sourceCommit"] != sys.argv[2]:
              raise SystemExit(f"package source {manifest['sourceCommit']} != workflow SHA {sys.argv[2]}")
          if manifest.get("scope", {}).get("originalGameComplete") is not False:
              raise SystemExit("full-game parity must remain explicitly unclaimed")
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/cpr-site-package.tar" -C "$RUNNER_TEMP/cpr-site-package" .
          gzip -n -6 "$RUNNER_TEMP/cpr-site-package.tar"
          archive_sha="$(sha256sum "$RUNNER_TEMP/cpr-site-package.tar.gz" | cut -d' ' -f1)"
          package_files="$(find "$RUNNER_TEMP/cpr-site-package" -type f | wc -l | tr -d ' ')"
          printf '\\n### Integrity-verified full Mission source package\\n\\n- Source SHA: `%s`\\n- Recovery archive SHA-256: `%s`\\n- Source index SHA-256: `%s`\\n- Package files (including build manifest): `%s`\\n- Deterministic tar.gz SHA-256: `%s`\\n- Full-game parity: **NOT CLAIMED**\\n- Build result: `%s`\\n- Independent package verify: `%s`\\n' \
            "$GITHUB_SHA" "$RECOVERY_SHA256" "$SOURCE_INDEX_SHA256" "$package_files" "$archive_sha" \
            "$(cat "$RUNNER_TEMP/cpr-package-build.json")" \
            "$(cat "$RUNNER_TEMP/cpr-package-verify.json")" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain integrity-verified complete Mission site package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crisis-response-site-package-${{ github.sha }}
          path: ${{ runner.temp }}/cpr-site-package.tar.gz
          if-no-files-found: error
          retention-days: 14

  indexeddb-browser:
    name: Chromium IndexedDB cache acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install pinned browser-test dependency
        run: npm ci --prefix game --ignore-scripts

      - name: Install Chromium
        run: game/node_modules/.bin/playwright install --with-deps chromium

      - name: Exercise production loader with browser IndexedDB
        run: node scripts/indexeddb_browser_smoke.mjs
