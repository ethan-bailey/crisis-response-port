name: CharacterBody original facing native contracts
on:
  push:
    branches: [feature/characterbody-original-facing-helpers]
    paths: [.github/workflows/characterbody-facing-contracts.yml]
permissions:
  contents: read
jobs:
  native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - name: Select pinned .NET SDK
        run: cp tools/wasm-compile/global.json global.json
      - name: Execute original runtime including CharacterBody facing checks
        run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj
