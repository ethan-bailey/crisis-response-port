name: Recover original full limb physiology muscle prefab
on:
  push:
    branches: [feature/characterbody-live-physiology-full-rig]
    paths: [.github/workflows/recover-original-full-character-limbs.yml]
permissions: {contents: write, actions: read}
jobs:
  original-limbs:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve checksum-pinned original developer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11903811738/zip" > /tmp/verified-original.zip
          echo 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  /tmp/verified-original.zip' | sha256sum -c -
      - name: Export original 19-limb Physiology/Muscle/Vital metadata for both characters
        run: |
          python3 scripts/recover_character_limb_components.py /tmp/verified-original.zip --output game/assets/original-character-limb-components.json
      - name: Preserve original verified export in feature branch
        run: |
          git add game/assets/original-character-limb-components.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve original Operator and Occupant 19-limb serialized physiology and muscle settings'
            git push origin HEAD:feature/characterbody-live-physiology-full-rig
          fi
