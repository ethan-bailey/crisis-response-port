name: Recover original arm limb and weapon dependency sources (private)
on:
  push:
    branches: [feature/22-limb-hand-source]
    paths: ['.github/workflows/restore-original-arm-limb-sources.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Require private repo and SHA-verified archived original game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/22-limb-hand-source"
          test "$(gh api repos/$GITHUB_REPOSITORY --jq '.private')" = 'true'
          mkdir -p work/recovery
          gh release download recovery-preservation-2026-10-15 --repo "$GITHUB_REPOSITORY" --pattern crisis-response-recovery-direct-v3-1.zip --dir work/recovery
          echo 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  work/recovery/crisis-response-recovery-direct-v3-1.zip' | sha256sum -c -
      - name: Preserve source-exact six original developer dependency classes
        run: |
          set -euo pipefail
          python3 scripts/preserve_original_arm_limb_dependencies.py work/recovery/crisis-response-recovery-direct-v3-1.zip --repo . | tee work/original-arm-dependency-manifest.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          m=json.loads(pathlib.Path("source-reference/Original/ArmDependencies/source-provenance.json").read_text())
          assert not m["controllerPlaybackImplemented"]
          assert m["compiledOriginalCount"]==0 and len(m["classes"])==6
          for name,v in m["classes"].items():
              data=pathlib.Path(v["repositoryPath"]).read_bytes()
              assert hashlib.sha256(data).hexdigest()==v["sha256"],name
          print("Six true original developer classes preserved, zero source classes selected for compilation")
          PY
          git diff --check
      - name: Commit exact private original blobs if branch head is unchanged
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/feature/22-limb-hand-source | awk '{print $1}')"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo 'Concurrent branch update: preserve artifact only, never overwrite another worker'
            exit 0
          fi
          git add source-reference/Original/ArmDependencies/
          if git diff --cached --quiet; then
            echo 'Exact source already committed'
            exit 0
          fi
          git -c user.name="Crisis Port Source Recovery" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Preserve immutable original Hand/Limb/Joint/Weapon/TeamOperator/ArmsControl references"
          git push origin HEAD:refs/heads/feature/22-limb-hand-source
          git rev-parse HEAD | tee work/original-limb-commit.txt
      - name: Preserve source hashes privately without exposing game assets publicly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-original-arm-limb-source-dependencies
          path: |
            work/original-arm-dependency-manifest.json
            work/original-limb-commit.txt
            source-reference/Original/ArmDependencies/source-provenance.json
          retention-days: 14
          if-no-files-found: warn
