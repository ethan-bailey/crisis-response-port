name: Mission 01 separate game movement smoke test

on:
  push:
    paths:
      - "game/assets/mission01.obj"
      - "game/assets/operator/operator.json"
      - "game/index.html"
      - "game/**"
      - "scripts/contact_physics_smoke.mjs"
      - "scripts/vendor_physics.mjs"
      - "runtime/**"
      - "scripts/browser_input_test.mjs"
      - "scripts/iphone_input_smoke.mjs"
      - ".github/workflows/game-movement-smoke.yml"
      - "scripts/game_movement_smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-movement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare pinned PhysX WebAssembly backend
        run: |
          npm ci --prefix game --ignore-scripts --no-audit --no-fund
          node scripts/vendor_physics.mjs
      - name: Build original C# input runtime beside the game prototype
        run: |
          cp game/browser-input.mjs runtime/Browser/wwwroot/browser-input.mjs
          dotnet publish runtime/Browser/Crisis.Runtime.Browser.csproj -c Release -o work/game-runtime
          mkdir -p work/game-site/runtime-web
          cp -a game work/game-site/game
          cp -a work/game-runtime/wwwroot/. work/game-site/runtime-web/
          sed -i 's#<base href="/">#<base href="/runtime-web/">#' work/game-site/runtime-web/index.html
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify independent touch ownership and lifecycle resets
        run: node --test scripts/browser_input_test.mjs
      - name: Serve the separate game build
        run: |
          python3 -m http.server 8000 --directory work/game-site >/tmp/crisis-game-server.log 2>&1 &
          sleep 2
      - name: Verify original scene contacts, stopping and reversal
        run: node scripts/contact_physics_smoke.mjs
      - name: Verify original scene, original Operator textures, and movement
        run: node scripts/game_movement_smoke.mjs
      - name: Verify landscape input in Chromium and WebKit
        run: node scripts/iphone_input_smoke.mjs
      - name: Upload separate game build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-mission01-game-smoke
          path: |
            contact-physics-smoke.json
            mission01-game-smoke.json
            mission01-game-smoke.png
            iphone-input-smoke.json
            iphone-input-chromium.png
            iphone-input-webkit.png
          if-no-files-found: warn
          retention-days: 30

