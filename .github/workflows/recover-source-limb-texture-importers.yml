name: Recover source limb TextureImporter properties
on:
  push:
    branches: [feature/source-limb-texture-importers]
    paths: [.github/workflows/recover-source-limb-texture-importers.yml]
permissions: {contents: write, actions: read}
jobs:
  importer-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Download verified original developer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11903811738/zip" >/tmp/original.zip
          echo 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  /tmp/original.zip' | sha256sum -c -
      - name: Recover all original skin texture importers by source GUID
        run: |
          python3 scripts/recover_original_skin_texture_importers.py /tmp/original.zip game/assets/operator/operator.json source-reference/Original/LimbSkin/original-texture-importers.json
      - name: Commit source file metadata preservation
        run: |
          git add source-reference/Original/LimbSkin/original-texture-importers.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve SHA-verified original limb PNG texture importer wrap modes and filtering'
            git push origin HEAD:feature/source-limb-texture-importers
          fi
