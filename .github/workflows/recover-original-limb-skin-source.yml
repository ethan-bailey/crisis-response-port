name: Recover original skin-mask traversal source
on:
  push:
    branches: [feature/original-limb-renderer-trace]
    paths: [.github/workflows/recover-original-limb-skin-source.yml]
permissions: {contents: write, actions: read}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified developer archive
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11903811738/zip" > /tmp/game.zip
          echo 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  /tmp/game.zip' | sha256sum -c -
      - name: Preserve exact original mask sampling algorithms
        run: python3 scripts/recover_original_limb_skin_source.py /tmp/game.zip source-reference/Original/LimbSkin
      - name: Commit original source to feature branch
        run: |
          git add source-reference/Original/LimbSkin
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Recover original LimbTextureData and pixel-trace dependencies'
            git push origin HEAD:feature/original-limb-renderer-trace
          fi
