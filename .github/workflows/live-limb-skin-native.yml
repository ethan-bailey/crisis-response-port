name: Live original LimbRenderer source bindings native checks
on:
  push:
    branches: [feature/live-original-limb-skin-binding]
    paths: [.github/workflows/live-limb-skin-native.yml]
permissions: {contents: read}
jobs:
  skin:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - name: Compile live source skin/limb/organ binding
        run: |
          cp tools/wasm-compile/global.json global.json
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --original-limb-skin
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-systems
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-dependencies
