name: Unity four-error scoped recompilation

on:
  push:
    paths:
      - ".github/workflows/unity-scoped-four-errors.yml"
      - "scripts/unity_scoped_legacy_gui_patch.py"

permissions:
  contents: read

jobs:
  scoped-recompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SPIKE_SCOPED_REPAIR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Free temporary disk for licensed Unity
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift /usr/local/share/powershell
          docker system prune -af >/dev/null 2>&1 || true
          df -h .
      - name: Patch four utility types in temporary recovered project and recompile once
        run: bash scripts/unity_open_spike.sh
      - name: Emergency entitlement seat deactivation
        if: always()
        run: |
          ID="crisis-unity-personal-$GITHUB_RUN_ID"
          if docker ps --format '{{.Names}}' | grep -Fxq "$ID"; then
            docker exec "$ID" /bin/bash -lc '
              c="$(command -v Unity.Licensing.Client || find /opt/unity -name Unity.Licensing.Client -type f -print -quit)"
              test -n "$c" && "$c" --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
            ' > /tmp/emergency-seat.raw 2>&1 || true
            docker rm -f "$ID" >/dev/null 2>&1 || true
            echo "Emergency deactivation attempted; consult seat logs"
          fi
      - name: Classify compiler and asset diagnostics
        if: always()
        run: |
          python3 scripts/classify_unity_spike.py --log work/unity-spike/import.log --status-file work/unity-spike/status.env --out work/unity-spike/classification.json
      - name: Save source-free diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-scoped-four-error-evidence
          path: |
            work/unity-spike/*.json
            work/unity-spike/*.log
            work/unity-spike/*.env
            work/unity-spike/*.txt
          retention-days: 30
          if-no-files-found: warn
