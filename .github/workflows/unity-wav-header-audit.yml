name: Validate recovered WAV headers without editing game assets
on:
  push:
    paths:
      - ".github/workflows/unity-wav-header-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-header-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify private recovery and inspect WAV sizes, non-mutating
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq '.private')" = true
          mkdir -p work/wav-headers/recovered
          gh release download recovery-preservation-2026-10-15 -p crisis-response-recovery-direct-v3-1.zip -D work/wav-headers
          printf 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  work/wav-headers/crisis-response-recovery-direct-v3-1.zip\n' | sha256sum -c -
          unzip -q work/wav-headers/crisis-response-recovery-direct-v3-1.zip 'export/ExportedProject/Assets/AudioClip/*' -d work/wav-headers/recovered
          python3 scripts/repair_recovered_wav_headers.py work/wav-headers/recovered/export/ExportedProject --expected 250 --out work/wav-headers/audit.json
          rm -rf work/wav-headers/recovered work/wav-headers/crisis-response-recovery-direct-v3-1.zip
      - name: Save source-free validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-wav-headers-audit
          path: work/wav-headers/audit.json
          retention-days: 14
          if-no-files-found: warn
