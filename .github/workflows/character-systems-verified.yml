name: Verify original character source injury physics animation and IK
on:
  push:
    branches: [feature/source-character-physiology-ragdoll-animation-sequencer]
    paths: [.github/workflows/character-systems-verified.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-systems:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use pinned source runtime toolchain
        run: cp tools/wasm-compile/global.json global.json
      - name: Execute original source C# character injury/physics/IK contracts
        run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-systems
      - name: Execute restored Unity AnimatorController transition contracts
        run: node --test scripts/source_character_animator_test.mjs
      - name: Verify JavaScript source compiles without loading browser
        run: node --check game/source-character-animator.mjs
