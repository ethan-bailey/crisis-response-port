name: Recover original character dependencies and AnimatorController
on:
  push:
    branches: [feature/source-character-physiology-ragdoll-animation-sequencer]
    paths: [.github/workflows/recover-character-execution.yml]
permissions:
  actions: read
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned private recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11903811738/zip" > /tmp/crisis-recovery.zip
          echo 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  /tmp/crisis-recovery.zip' | sha256sum -c -
      - name: Recover verified original code and character animation source
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,json
          z=zipfile.ZipFile('/tmp/crisis-recovery.zip')
          root=pathlib.Path('source-reference/Original/CharacterExecution')
          root.mkdir(parents=True,exist_ok=True)
          code=['LimbPhysiology','LimbMuscle','Wound','LimbVitalFunction','LimbAttachment','IKArmSequencer','IKArmController','BloodStreamGenerator','VitalFunctions','CharacterBody','Physiology','Limb']
          manifest={'archiveSha256':'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d','files':{}}
          for name in code:
           path='decompiled/'+name+'.cs'
           data=z.read(path)
           target=root/(name+'.cs');target.write_bytes(data)
           manifest['files'][str(target)]={'archivePath':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          for path in ['export/ExportedProject/Assets/AnimatorController/Character animator.controller',
                       'export/ExportedProject/Assets/AnimationClip/Body kneel.anim',
                       'export/ExportedProject/Assets/AnimationClip/Body sprint.anim',
                       'export/ExportedProject/Assets/AnimationClip/Body stand.anim',
                       'export/ExportedProject/Assets/AnimationClip/Body walk backward.anim',
                       'export/ExportedProject/Assets/AnimationClip/Body walk.anim',
                       'export/ExportedProject/Assets/AnimationClip/One leg limp.anim']:
           data=z.read(path)
           dest=root/'Animation'/path.split('/')[-1]
           dest.parent.mkdir(exist_ok=True)
           dest.write_bytes(data)
           manifest['files'][str(dest)]={'archivePath':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (root/'provenance.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print('Preserved',len(manifest['files']),'source code/animation files with SHA-256')
          PY
      - name: Commit only original source reference artifacts
        run: |
          git add source-reference/Original/CharacterExecution
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Recover original injury, limb, IK source and AnimatorController with source hashes'
            git push origin HEAD:feature/source-character-physiology-ragdoll-animation-sequencer
          fi
