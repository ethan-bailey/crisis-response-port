name: Validate original character physics animation physiology primitives
on:
  push:
    branches: [feature/characterbody-dependency-primitives]
    paths: [.github/workflows/characterbody-primitives.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - run: cp tools/wasm-compile/global.json global.json
      - run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-dependencies
