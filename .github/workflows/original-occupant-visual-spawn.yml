name: Verify original Occupant renderer and scene spawner manifest
on:
  push:
    branches: [feature/original-projectile-limb-hit-runtime]
    paths:
      - scripts/export_original_occupant_visual_spawn.py
      - .github/workflows/original-occupant-visual-spawn.yml
      - source-reference/Original/NPCRecovery/Assets/**
      - game/source-occupant-spawner.mjs
      - scripts/test_original_occupant_spawn.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/export_original_occupant_visual_spawn.py
      - run: node scripts/test_original_occupant_spawn.mjs
      - run: |
          python3 - <<'PY'
          import json
          with open('game/assets/occupant/source-visual-spawn.json') as f: data=json.load(f)
          assert len(data['nodes'])==56
          assert len(data['renderers'])==20
          assert len(data['dynamicLimbSkins'])==16
          assert set(data['sceneSpawners'])=={'Mission 01','Marksman range'}
          print('Source NPC visual/spawner manifest verification PASS')
          PY
      - name: Retain exact recovered NPC visual/spawn manifest on branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/occupant/source-visual-spawn.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve original Occupant render hierarchy and authentic scene spawn definition manifest"
            git pull --rebase origin feature/original-projectile-limb-hit-runtime
            git push origin HEAD:feature/original-projectile-limb-hit-runtime
          fi
