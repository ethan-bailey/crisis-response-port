name: Export original complete character PhysX graph
# Flatten genuine original PhysicsManager fields for the established PhysX importer.
on:
  push:
    branches: [feature/characterbody-live-physiology-full-rig]
    paths: [.github/workflows/export-original-full-character-physics.yml]
permissions: {contents: write}
jobs:
  source-actors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Generate exact source-backed full actor asset
        run: |
          python3 scripts/export_full_character_physics.py source-reference/Original/ArmPhysics/prefabs.json game/assets/original-full-character-physics.json
          node --check game/original-arm-rig-import.mjs
      - name: Commit original verified serialized actors
        run: |
          git add game/assets/original-full-character-physics.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve all original Operator/Occupant PhysX rigidbodies, capsules and 18 hinges'
            git push origin HEAD:feature/characterbody-live-physiology-full-rig
          fi
