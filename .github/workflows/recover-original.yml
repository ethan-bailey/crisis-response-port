name: Recover Crisis Response source and assets

on:
  push:
    paths:
      - ".github/workflows/recover-original.yml"
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL to the official Sandbox 7 ZIP (leave default unless it changes)"
        required: false
        default: "https://crisisresponsegame.com/downloads/cr-0.0.9.7919.zip"
        type: string

permissions:
  contents: read

concurrency:
  group: crisis-response-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out porting notes
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download official Sandbox 7 package
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://crisisresponsegame.com/downloads/cr-0.0.9.7919.zip' }}
        run: |
          set -euo pipefail
          mkdir -p work/source work/reports work/decompiled work/export
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            "$SOURCE_URL" -o work/source/crisis-response.zip
          file work/source/crisis-response.zip
          unzip -t work/source/crisis-response.zip
          unzip -q work/source/crisis-response.zip -d work/source/unpacked
          find work/source/unpacked -maxdepth 4 -type f -name 'Assembly-CSharp.dll' -print -quit | grep -q .
          GAME_DLL="$(find work/source/unpacked -maxdepth 4 -type f -name 'Assembly-CSharp.dll' -print -quit)"
          printf 'Downloaded package SHA-256: ' > work/reports/source-verification.txt
          sha256sum work/source/crisis-response.zip >> work/reports/source-verification.txt
          printf 'Assembly-CSharp.dll SHA-256: ' >> work/reports/source-verification.txt
          sha256sum "$GAME_DLL" >> work/reports/source-verification.txt
          EXPECTED='482f8bd6ef4546965b060463377470fc2da2db996de7ec16f29eb88f56a021b3'
          ACTUAL="$(sha256sum "$GAME_DLL" | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "STOP: public package Assembly-CSharp.dll does not match the user's archived assembly." | tee -a work/reports/source-verification.txt
            echo "Expected $EXPECTED but got $ACTUAL. Do not substitute this build for the user's source." | tee -a work/reports/source-verification.txt
            exit 12
          fi
          echo "PASS: Assembly-CSharp.dll matches the SHA-256 recorded from the user's original archive." | tee -a work/reports/source-verification.txt
          printf '%s\n' "$GAME_DLL" > work/reports/game-dll-path.txt
          printf '%s\n' "$(dirname "$(dirname "$GAME_DLL")")" > work/reports/game-root-path.txt

      - name: Decompile original managed gameplay assembly
        if: success()
        run: |
          set -euo pipefail
          dotnet tool install --global ilspycmd --version 11.1.0.9782
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          GAME_DLL="$(cat work/reports/game-dll-path.txt)"
          MANAGED_DIR="$(dirname "$GAME_DLL")"
          "$HOME/.dotnet/tools/ilspycmd" --version
          "$HOME/.dotnet/tools/ilspycmd" --nested-directories -p \
            -r "$MANAGED_DIR" -o work/decompiled "$GAME_DLL" \
            2>&1 | tee work/reports/ilspy-decompilation.log
          find work/decompiled -type f -name '*.cs' | wc -l > work/reports/decompiled-csharp-file-count.txt

      - name: Build AssetRipper CLI from source
        if: success()
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/github/AssetRipper
          sudo chown -R "$USER":"$USER" /opt/github/AssetRipper
          git clone --depth 1 --branch 2.0.0 https://github.com/AssetRipper/AssetRipper.git /opt/github/AssetRipper/AssetRipper
          git clone --depth 1 https://github.com/neoedmund/AssetRipperCLI.git /opt/github/AssetRipperCLI
          dotnet publish /opt/github/AssetRipperCLI/AssetRipperCLI.csproj \
            --configuration Release --runtime linux-x64 --output work/assetripper-cli \
            2>&1 | tee work/reports/assetripper-build.log

      - name: Recover editable Unity project and assets
        if: success()
        run: |
          set -euo pipefail
          GAME_ROOT="$(dirname "$(find work/source/unpacked -maxdepth 4 -type f -iname 'Crisis Response.exe' -print -quit)")"
          test -n "$GAME_ROOT" -a -d "$GAME_ROOT"
          chmod +x work/assetripper-cli/AssetRipperCLI
          work/assetripper-cli/AssetRipperCLI "$GAME_ROOT" work/export \
            2>&1 | tee work/reports/assetripper-export.log
          test -d work/export
          find work/export -type f | wc -l > work/reports/exported-file-count.txt
          du -sh work/export > work/reports/exported-size.txt
          find work/export -maxdepth 3 -type f \( -name 'ProjectVersion.txt' -o -name 'manifest.json' -o -name '*.unity' \) \
            | head -100 > work/reports/unity-project-landmarks.txt

      - name: Create recovery summary
        if: always()
        run: |
          {
            echo "# Automated recovery run"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Source: official Crisis Response Sandbox 7 ZIP; exact game assembly hash is required to match the user-provided archive."
            echo
            echo "## Source verification"
            if [ -f work/reports/source-verification.txt ]; then cat work/reports/source-verification.txt; else echo "Source verification did not complete."; fi
            echo
            echo "## Decompiled C#"
            if [ -f work/reports/decompiled-csharp-file-count.txt ]; then echo "C# files recovered: $(cat work/reports/decompiled-csharp-file-count.txt)"; else echo "Decompilation did not complete."; fi
            echo
            echo "## Unity asset/project recovery"
            if [ -f work/reports/exported-file-count.txt ]; then echo "Exported files: $(cat work/reports/exported-file-count.txt)"; cat work/reports/exported-size.txt; else echo "Asset/project export did not complete."; fi
            echo
            echo "## Limits"
            echo "A recovered Unity project and decompiled C# are analysis inputs, not a finished iPhone app. A compatible Unity Editor/WebGL build and browser/device parity tests remain separate gates."
          } > work/RECOVERY_SUMMARY.md
          cat work/RECOVERY_SUMMARY.md

      - name: Upload recovery outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-recovery-${{ github.run_number }}
          path: |
            work/RECOVERY_SUMMARY.md
            work/reports/
            work/decompiled/
            work/export/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
