name: Recover original projectile and limb impact source
on:
  push:
    branches: [feature/live-character-limb-ballistic-damage]
    paths: [.github/workflows/recover-original-projectile-source.yml]
permissions: {contents: write, actions: read}
jobs:
  original-projectiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve checksum pinned original export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11903811738/zip" > /tmp/original.zip
          echo 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  /tmp/original.zip' | sha256sum -c -
      - name: Preserve exact developer source and provenance
        run: python3 scripts/recover_original_projectile_sources.py /tmp/original.zip source-reference/Original/ProjectileInteractions
      - name: Commit source-only recovery to feature branch
        run: |
          git add source-reference/Original/ProjectileInteractions
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve checksum verified original projectile and limb collision source'
            git push origin HEAD:feature/live-character-limb-ballistic-damage
          fi
