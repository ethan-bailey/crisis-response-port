name: Export recovered original AnimatorController state graph
on:
  push:
    branches: [feature/source-character-physiology-ragdoll-animation-sequencer]
    paths: [.github/workflows/export-character-animator.yml]
permissions: {contents: write}
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Derive checked source AnimatorController graph
        run: |
          python3 scripts/export_original_character_animator.py 'source-reference/Original/CharacterExecution/Animation/Character animator.controller' game/assets/operator/character-animator-controller.json
          python3 - <<'PY'
          import json
          x=json.load(open('game/assets/operator/character-animator-controller.json'))
          assert x['sourceSha256']=='d1ef99a73f2f600c09be9f099e6f88b10aff8328099621c45ce19a6c5635803b'
          assert len(x['states'])==4
          PY
      - name: Commit sourced output
        run: |
          git add game/assets/operator/character-animator-controller.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Export exact original 4-state Character AnimatorController graph'
            git push origin HEAD:feature/source-character-physiology-ragdoll-animation-sequencer
          fi
