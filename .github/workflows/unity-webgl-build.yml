name: Build recovered Crisis Response for WebGL

on:
  push:
    paths:
      - ".github/workflows/unity-webgl-build.yml"
      - "scripts/webgl_preflight.py"
      - "scripts/scene_dependency_audit.py"
      - "scripts/unity_api_inventory.py"
      - "scripts/scene_manifest.py"
      - "scripts/unity_mesh_to_obj.py"
      - "scripts/browser_mesh_smoke.mjs"
      - "runtime-spike/mesh-viewer/index.html"
      - "scripts/wasm_target_spike.sh"
      - "scripts/wasm_target_smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        name: Check out porting repository

      - name: Download verified recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/recovery-artifact
          gh run download 38582072502 \
            --repo "$GITHUB_REPOSITORY" \
            --name crisis-response-recovery-direct-v3-1 \
            --dir work/recovery-artifact
          test -f work/recovery-artifact/export/ExportedProject/ProjectSettings/ProjectVersion.txt
          cat work/recovery-artifact/export/ExportedProject/ProjectSettings/ProjectVersion.txt

      - name: Run static WebGL preflight
        run: |
          set -euo pipefail
          python3 scripts/webgl_preflight.py \
            work/recovery-artifact/export/ExportedProject \
            work/WEBGL_PREFLIGHT.md
          cat work/WEBGL_PREFLIGHT.md

      - name: Export the original Marksman range combined mesh
        id: mesh_export
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/unity_mesh_to_obj.py \
            "work/recovery-artifact/export/ExportedProject/Assets/Mesh/Combined Mesh (root_ scene)_0.asset" \
            work/mesh/marksman-combined.obj
          cat work/mesh/marksman-combined.mesh-report.json
          test -s work/mesh/marksman-combined.obj

      - name: Upload original mesh export and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-original-mesh-export
          path: |
            work/mesh/marksman-combined.obj
            work/mesh/marksman-combined.mesh-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Browser-render smoke test for extracted original geometry
        id: browser_smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p work/mesh-viewer
          cp runtime-spike/mesh-viewer/index.html work/mesh-viewer/index.html
          cp work/mesh/marksman-combined.obj work/mesh-viewer/marksman-combined.obj
          npm init -y
          npm install --no-audit --no-fund three@0.180.0 playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 > /tmp/crisis-response-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/browser_mesh_smoke.mjs

      - name: Upload browser geometry smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-browser-geometry-smoke
          path: |
            work/mesh-viewer-smoke.png
            work/mesh-viewer-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Set up .NET WebAssembly toolchain
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile original Target.cs into a browser WASM app
        id: wasm_build
        continue-on-error: true
        run: |
          set -euo pipefail
          bash scripts/wasm_target_spike.sh \
            work/recovery-artifact/export/ExportedProject \
            work/wasm-target

      - name: Run original Target.cs in browser WebAssembly
        id: wasm_smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m http.server 8001 --directory work/wasm-target/published/wwwroot > /tmp/crisis-response-wasm-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/wasm_target_smoke.mjs

      - name: Upload C# WebAssembly feasibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-csharp-wasm-spike
          path: |
            work/wasm-target/wasm-spike-report.md
            work/wasm-target-smoke.json
            work/wasm-target-smoke.png
          if-no-files-found: warn
          retention-days: 30

      - name: Extract original Marksman range scene manifest
        run: |
          set -euo pipefail
          python3 scripts/scene_manifest.py \
            work/recovery-artifact/export/ExportedProject \
            "Assets/Scenes/Marksman range.unity" \
            work/MARKSMAN_RANGE_SCENE_MANIFEST.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("work/MARKSMAN_RANGE_SCENE_MANIFEST.json")
          data = json.loads(p.read_text())
          print("Scene:", data["sourceScene"])
          print("Serialized records:", data["records"])
          print("GameObjects:", len(data["gameObjects"]))
          print("Class counts:", data["classCounts"])
          print("Objects with scripts:", sum(any(c.get("script") for c in o.get("componentDetails", [])) for o in data["gameObjects"]))
          print("Objects with mesh filters:", sum(any(c.get("className") == "MeshFilter" for c in o.get("componentDetails", [])) for o in data["gameObjects"]))
          PY

      - name: Upload original scene manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-marksman-range-scene-manifest
          path: work/MARKSMAN_RANGE_SCENE_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

      - name: Inventory Unity API use in recovered C# source
        run: |
          set -euo pipefail
          python3 scripts/unity_api_inventory.py \
            work/recovery-artifact/export/ExportedProject \
            work/UNITY_API_INVENTORY.md
          cat work/UNITY_API_INVENTORY.md

      - name: Upload Unity API inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-unity-api-inventory
          path: work/UNITY_API_INVENTORY.md
          if-no-files-found: error
          retention-days: 30

      - name: Run recursive Marksman range scene dependency audit
        run: |
          set -euo pipefail
          python3 scripts/scene_dependency_audit.py \
            work/recovery-artifact/export/ExportedProject \
            work/MARKSMAN_RANGE_DEPENDENCIES.md
          cat work/MARKSMAN_RANGE_DEPENDENCIES.md

      - name: Upload scene dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-marksman-range-dependencies
          path: work/MARKSMAN_RANGE_DEPENDENCIES.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload static preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-webgl-preflight
          path: work/WEBGL_PREFLIGHT.md
          if-no-files-found: error
          retention-days: 30

      - name: Check Unity license secrets
        id: license-check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity license secrets are present; attempting WebGL build."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Unity license secrets are not configured. The Unity build will be skipped; configure valid Unity credentials/license in GitHub Actions secrets to proceed."
          fi

      - name: Build WebGL player
        if: steps.license-check.outputs.ready == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: work/recovery-artifact/export/ExportedProject
          unityVersion: 2017.2.0f3
          targetPlatform: WebGL
          buildName: CrisisResponse
          allowDirtyBuild: true

      - name: Upload WebGL output
        if: always() && steps.license-check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-webgl-build
          path: build/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14

      - name: Record build gate status
        if: always()
        run: |
          {
            echo "# WebGL build gate"
            echo
            echo "- Recovery run: https://github.com/ethan-bailey/crisis-response-port/actions/runs/38582072502"
            if [ "${{ steps.license-check.outputs.ready }}" = "true" ]; then
              echo "- Unity license secrets: configured; inspect the Unity build step and output artifact."
            else
              echo "- Unity license secrets: missing. The static preflight runs without them, but a Unity build requires valid activation."
              echo "- Configure UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD as GitHub Actions secrets only if a valid license is available; do not send them in chat."
              echo "- No license credentials were requested in chat or committed to the repository."
            fi
            echo "- The source project is Unity 2017.2.0f3. Static scan results are not compiler errors. A successful compilation still needs runtime checks and parity tests before it can be called a working port."
          } > work/WEBGL_BUILD_GATE.md
          cat work/WEBGL_BUILD_GATE.md

      - name: Upload build gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-webgl-build-gate
          path: work/WEBGL_BUILD_GATE.md
          retention-days: 14

      - name: Fail the run if original mesh extraction did not validate
        if: always()
        run: |
          if [ "${{ steps.mesh_export.outcome }}" != "success" ] || [ "${{ steps.browser_smoke.outcome }}" != "success" ] || [ "${{ steps.wasm_build.outcome }}" != "success" ] || [ "${{ steps.wasm_smoke.outcome }}" != "success" ]; then
            echo "Original mesh export, browser geometry smoke test, or C# WebAssembly feasibility gate failed; inspect the step logs. Other audit artifacts were still collected."
            exit 1
          fi


