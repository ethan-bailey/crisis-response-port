name: Original LimbRenderer native pixel traces
on:
  push:
    branches: [feature/original-limb-renderer-trace]
    paths: [.github/workflows/original-limb-skin-native.yml]
permissions: {contents: read}
jobs:
  source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - name: Native original texture damage mask and 11 source skin trace contracts
        run: |
          cp tools/wasm-compile/global.json global.json
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --original-limb-skin
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-systems
      - name: Preserve source trace correspondence
        run: |
          python3 - <<'PY'
          import hashlib,json
          p='source-reference/Original/LimbSkin/provenance.json';j=json.load(open(p))
          assert j['archiveSha256']=='cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d'
          for name,s in j['sources'].items():
            assert hashlib.sha256(open('source-reference/Original/LimbSkin/'+name,'rb').read()).hexdigest()==s['sha256']
          print('Exact source pixel trace methods and developer SHA files verified')
          PY
