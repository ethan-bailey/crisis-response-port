# Explicit replay: source NPC spawn random/collision validation and group preflight milestone
name: Audit milestone original WASM baseline verification

# Execute original Torso skin/ammunition injury graph and compliance timing in native/WASM; live NPC contacts stay gated.
# Merging reviewed code into develop/wasm must not duplicate the expensive build.
# No automatic builds on source/doc edits, and workflow_dispatch remains available.
on:
  push:
    branches: ["feature/**", "fix/**"]
    paths: [.github/workflows/wasm-arm-sequences.yml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: original-wasm-arm-sequences-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY --jq '.private')" = true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - name: Select pinned SDK for this workflow only
        run: |
          test ! -e global.json
          cp tools/wasm-compile/global.json global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact source and toolchain
        run: |
          mkdir -p work/evidence
          git rev-parse HEAD > work/evidence/source-commit.txt
          python3 - <<'PY'
          import json, platform, subprocess
          versions = {name: subprocess.check_output(command, text=True).strip()
                      for name, command in {'dotnet':['dotnet','--version'], 'node':['node','--version'], 'npm':['npm','--version']}.items()}
          versions['python'] = platform.python_version()
          open('work/evidence/toolchain.json','w').write(json.dumps(versions, sort_keys=True, indent=2)+'\n')
          PY
      - name: Verify unchanged original sequence, hand, limb, and controller source provenance
        run: |
          set -o pipefail
          python3 scripts/verify_original_arm_sequences.py | tee work/evidence/arm-source-check.json
          python3 scripts/verify_original_arm_controller_references.py | tee work/evidence/controller-source-check.json
          python3 scripts/verify_original_arm_limb_sources.py | tee work/evidence/hand-limb-source-check.json
          python3 scripts/verify_original_hand_runtime.py | tee work/evidence/original-hand-runtime-check.json
          python3 scripts/verify_original_combat_source.py | tee work/evidence/original-combat-source-check.json
      - name: Test package corruption and mixed-build rejection
        run: python3 -m unittest discover -s scripts -p package_wasm_site_test.py -v 2>&1 | tee work/evidence/package-tests.txt
      - name: Execute recovered original native contracts
        run: |
          set -o pipefail
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj | tee work/evidence/native-contracts.jsonl
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --projectile-injury-chain | tee work/evidence/projectile-injury-native.json
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --source-tissue-penetration | tee work/evidence/source-tissue-native.json
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --source-limb-interior | tee work/evidence/source-interior-native.json
          dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-systems | tee work/evidence/character-systems-native.json
      - name: Prepare original scene and pinned PhysX
        run: |
          npm ci --prefix game --ignore-scripts --no-audit --no-fund
          node scripts/vendor_physics.mjs
          python3 scripts/build_scene_binary.py game/assets/mission01.obj game/assets/mission01.crg
      - name: Verify recovered source and input regressions
        run: |
          node --test scripts/browser_input_test.mjs scripts/animation_pose_test.mjs scripts/game_loading_test.mjs scripts/aim_direction_test.mjs scripts/source_effect_clock_test.mjs scripts/original_particle_source_test.mjs scripts/original_particle_mesh_source_test.mjs scripts/original_particle_event_binding_test.mjs scripts/magazine_hud_test.mjs | tee work/evidence/source-tests.txt
      - name: Compile original-code .NET WebAssembly
        run: |
          set -o pipefail
          cp game/browser-input.mjs runtime/Browser/wwwroot/browser-input.mjs
          dotnet publish runtime/Browser/Crisis.Runtime.Browser.csproj -c Release -o work/published | tee work/evidence/publish-log.txt
      - name: Package both game and compiled runtime with source and output hashes
        run: |
          python3 scripts/package_wasm_site.py build --published work/published/wwwroot --output work/site --toolchain work/evidence/toolchain.json --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee work/evidence/package-validation.json
          cp work/site/build-manifest.json work/evidence/build-manifest.json
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C work/site . | gzip -n > work/crisis-response-private-wasm-site.tar.gz
          sha256sum work/crisis-response-private-wasm-site.tar.gz > work/evidence/site-archive.sha256
      - name: Verify unpacked package without rebuilding
        run: |
          mkdir -p work/unpacked
          tar -xzf work/crisis-response-private-wasm-site.tar.gz -C work/unpacked
          python3 scripts/package_wasm_site.py verify work/unpacked | tee work/evidence/unpacked-validation.json
      - name: Install browsers for this original-code execution milestone
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Execute original sequence composition and actual Hand.SetMode in both WASM browsers
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory work/site > work/evidence/http-server.log 2>&1 &
          node scripts/original_arm_sequences_smoke.mjs
          node scripts/projectile_injury_smoke.mjs
      - name: Boot original C# physical ArmController and verify kinematic PhysX rig in Chromium/WebKit
        run: |
          node scripts/weapon_smoke.mjs
          cp weapon-smoke.json work/evidence/m4-magazine-browser-smoke.json
          cp weapon-chromium.png weapon-webkit.png original-hands-chromium.png original-hands-webkit.png original-occupant-in-game-chromium.png original-occupant-in-game-webkit.png work/evidence/
      - name: Store build evidence privately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-original-arm-sequences-evidence
          path: work/evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Store complete private site only after verification succeeds
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-arm-sequences-private-wasm-site
          path: work/crisis-response-private-wasm-site.tar.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error


