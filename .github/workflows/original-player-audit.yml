name: Audit original Mission 01 player dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_original_player.py"
      - "scripts/export_operator_manifest.py"
      - "scripts/unity_mesh_to_obj.py"
      - ".github/workflows/original-player-audit.yml"

permissions:
  contents: write
  actions: read

jobs:
  audit-original-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download verified private recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/recovery
          gh run download 38582072502 --repo "$GITHUB_REPOSITORY" --name crisis-response-recovery-direct-v3-1 --dir work/recovery
          test -f work/recovery/export/ExportedProject/Assets/Scenes/Mission\ 01.unity
      - name: Find original player, controller, and weapon references
        run: |
          set -euo pipefail
          python3 scripts/audit_original_player.py work/recovery/export/ExportedProject work/ORIGINAL_MISSION01_PLAYER_AUDIT.json
          cat work/ORIGINAL_MISSION01_PLAYER_AUDIT.json
          python3 scripts/export_operator_manifest.py work/recovery/export/ExportedProject work/operator-package
          cat work/operator-package/operator.json
          mkdir -p work/game-assets game/assets
          python3 scripts/unity_mesh_to_obj.py "work/recovery/export/ExportedProject/Assets/Mesh/Combined Mesh (root_ scene)_1.asset" work/game-assets/mission01.obj
          test -s work/game-assets/mission01.obj
          cp work/game-assets/mission01.obj game/assets/mission01.obj
          rm -rf game/assets/operator
          cp -a work/operator-package game/assets/operator
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f game/assets
          if git diff --cached --quiet; then
            echo "Original game assets are unchanged."
          else
            git commit -m "Publish recovered Mission 01 geometry and Operator textures"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload original player dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-original-mission01-player-audit
          path: |
            work/ORIGINAL_MISSION01_PLAYER_AUDIT.json
            work/operator-package
            work/game-assets/mission01.obj
            work/game-assets/mission01.mesh-report.json
          retention-days: 30
