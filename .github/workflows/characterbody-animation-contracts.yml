name: Verify original CharacterBody UpdateAnimation equations
on:
  push:
    branches: [feature/characterbody-original-animation-state]
    paths: [.github/workflows/characterbody-animation-contracts.yml]
permissions:
  contents: read
jobs:
  source-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - run: cp tools/wasm-compile/global.json global.json
      - run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-animation
