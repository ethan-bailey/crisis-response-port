name: Audit original impact-effect prefab render assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-prefab-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - name: Verify private original recovery and inspect effect-prefab references
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq '.private')" = true
          mkdir -p work/original-effect-audit/recovery
          gh release download recovery-preservation-2026-10-15 -p crisis-response-recovery-direct-v3-1.zip -D work/original-effect-audit
          printf 'cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  work/original-effect-audit/crisis-response-recovery-direct-v3-1.zip\n' | sha256sum -c -
          unzip -q work/original-effect-audit/crisis-response-recovery-direct-v3-1.zip 'export/ExportedProject/Assets/*' -d work/original-effect-audit/recovery
          python scripts/audit_original_effect_render_assets.py work/original-effect-audit/recovery/export/ExportedProject --out work/original-effect-audit/effect-refs.json
          python scripts/extract_original_exit_hole_mesh.py work/original-effect-audit/recovery/export/ExportedProject --out work/original-effect-audit/exit-hole-source.json
          rm -rf work/original-effect-audit/recovery work/original-effect-audit/crisis-response-recovery-direct-v3-1.zip
      - name: Preserve reference metadata only, no recovered assets or binary files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-effect-render-reference-audit
          path: |
            work/original-effect-audit/effect-refs.json
            work/original-effect-audit/exit-hole-source.json
          retention-days: 14
          if-no-files-found: warn
