name: PhysX implicit hinge springs and source capsule prerequisites
on:
  push:
    branches: [feature/26-hinge-spring-capsules]
    paths: [.github/workflows/arm-physics-prerequisites.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm-physics-prerequisites-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engine-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact tested source
        run: |
          mkdir -p work/arm-physics-evidence
          git rev-parse HEAD > work/arm-physics-evidence/source-commit.txt
          node --version > work/arm-physics-evidence/node-version.txt
      - name: Verify recovered original physics and hand topology
        run: python3 scripts/verify_original_arm_physics.py > work/arm-physics-evidence/source-topology.json
      - name: Prepare pinned PhysX and browser test runner
        run: |
          npm ci --prefix game --ignore-scripts --no-audit --no-fund
          node scripts/vendor_physics.mjs
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Execute numerical engine contracts in Chromium and WebKit
        run: node scripts/arm_physics_kernel_smoke.mjs
      - name: Preserve private evidence
        if: always()
        run: |
          if test -f arm-physics-kernel-smoke.json; then cp arm-physics-kernel-smoke.json work/arm-physics-evidence/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-physics-prerequisites-evidence
          path: work/arm-physics-evidence/
          retention-days: 30
          if-no-files-found: error
