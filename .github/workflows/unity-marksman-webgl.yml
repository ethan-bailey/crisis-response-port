name: Unity Marksman WebGL feasibility build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unity-personal-marksman-webgl
  cancel-in-progress: false
jobs:
  marksman:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SPIKE_SCOPED_REPAIR: "1"
      UNITY_SPIKE_ALLOW_UNET_EXCLUSION: "1"
      UNITY_SPIKE_WEBGL: "1"
      UNITY_SPIKE_SINGLE_PASS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for Unity WebGL editor
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift /usr/local/share/powershell
          docker system prune -af >/dev/null 2>&1 || true
          df -h .
      # Private branch cache: generated Unity import data, never Git history.
      # This does not cache the huge Unity Docker image on ephemeral GitHub runners.
      - name: Restore Unity imported Library and Bee build cache
        id: library_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            work/unity-spike/recovery/export/ExportedProject/Library
            work/unity-spike/bee-cache
          key: unity-marksman-library-bee-linux-2022.3.62f1-recoveryv3-v2-${{ hashFiles('scripts/unity_scoped_legacy_gui_patch.py', 'scripts/unity_webgl_template_fix.py', 'scripts/SpikeWebGL.cs', 'scripts/repair_recovered_wav_headers.py') }}
          restore-keys: |
            unity-marksman-library-bee-linux-2022.3.62f1-recoveryv3-v2-
      - name: Unity 2022.3 Personal import and Marksman-only WebGL build
        run: bash scripts/unity_open_spike.sh
      - name: Emergency Personal entitlement deactivation
        if: always()
        run: |
          ID="crisis-unity-personal-$GITHUB_RUN_ID"
          if docker ps --format '{{.Names}}' | grep -Fxq "$ID"; then
            docker exec "$ID" /bin/bash -lc '
              c="$(command -v Unity.Licensing.Client || find /opt/unity -name Unity.Licensing.Client -type f -print -quit)"
              test -n "$c" && "$c" --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
            ' >/tmp/webgl-emergency-license.log 2>&1 || true
            docker rm -f "$ID" >/dev/null 2>&1 || true
            echo "Emergency deactivation attempted."
          fi
      - name: Check imported Library and Bee cache size before saving
        id: library_size
        if: always()
        shell: bash
        run: |
          LIB="work/unity-spike/recovery/export/ExportedProject/Library"
          BEE="work/unity-spike/bee-cache"
          library_mb=0
          bee_mb=0
          if [ -d "$LIB" ]; then library_mb=$(du -sm "$LIB" | awk '{print $1}'); fi
          if [ -d "$BEE" ]; then bee_mb=$(du -sm "$BEE" | awk '{print $1}'); fi
          total_mb=$((library_mb + bee_mb))
          echo "Unity Library: ${library_mb} MiB; Bee cache: ${bee_mb} MiB; total: ${total_mb} MiB"
          echo "library_mb=$library_mb" >> "$GITHUB_OUTPUT"
          echo "bee_mb=$bee_mb" >> "$GITHUB_OUTPUT"
          # GitHub's default repository-wide cache quota is 10 GiB.
          # Leave room for other caches and prevent unbounded upload costs.
          if [ "$total_mb" -gt 0 ] && [ "$total_mb" -le 8192 ]; then
            echo "can_save=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Unity cache outside safe 1..8192 MiB range; not saved. Build state remains in Git history and logs."
            echo "can_save=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save private Unity Library and Bee build cache
        if: ${{ always() && steps.library_size.outputs.can_save == 'true' && steps.library_restore.outputs.cache-hit != 'true' }}
        timeout-minutes: 15
        uses: actions/cache/save@v4
        with:
          path: |
            work/unity-spike/recovery/export/ExportedProject/Library
            work/unity-spike/bee-cache
          key: ${{ steps.library_restore.outputs.cache-primary-key }}
      - name: Classify captured editor and WebGL logs
        if: always()
        run: |
          mkdir -p work/unity-spike
          python3 scripts/classify_unity_spike.py --log work/unity-spike/import.log --build-log work/unity-spike/webgl.log --status-file work/unity-spike/status.env --out work/unity-spike/classification.json
          echo "Never upload compiled original game or WebGL output."
      - name: Preserve evidence only without third-party assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-marksman-webgl-feasibility-logs
          path: |
            work/unity-spike/*.log
            work/unity-spike/*.json
            work/unity-spike/*.env
            work/unity-spike/*.txt
          retention-days: 14
          if-no-files-found: warn
