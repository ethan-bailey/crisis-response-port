name: Validate original Physiology blood and oxygen source methods
on:
  push:
    branches: [feature/source-physiology-blood-oxygen]
    paths: [.github/workflows/physiology-source-contracts.yml]
permissions:
  contents: read
jobs:
  source-physiology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/wasm-compile/global.json
      - run: cp tools/wasm-compile/global.json global.json
      - run: dotnet run --project runtime/Checks/Crisis.Runtime.Checks.csproj -- --character-dependencies
