name: Recover Crisis Response original via IndieDB

on:
  push:
    paths:
      - ".github/workflows/recover-indiedb.yml"
  workflow_dispatch:
    inputs:
      source_url:
        description: "ModDB mirror URL for the original Sandbox 7 installer"
        required: false
        default: "https://www.indiedb.com/downloads/mirror/130316/136/ed9facab7023eda546c6bddf86f094fc"
        type: string

permissions:
  contents: read

concurrency:
  group: crisis-response-recovery-indiedb
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        name: Check out repository

      - uses: actions/setup-dotnet@v4
        name: Install .NET SDK
        with:
          dotnet-version: "10.0.x"

      - name: Download original Sandbox 7 installer from ModDB
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://www.indiedb.com/downloads/mirror/130316/136/ed9facab7023eda546c6bddf86f094fc' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full innoextract
          mkdir -p work/source/unpacked work/reports work/decompiled work/export
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            --user-agent "$UA" --cookie-jar work/source/moddb-cookies.txt \
            --cookie work/source/moddb-cookies.txt \
            "https://www.indiedb.com/downloads/start/130316/all" -o work/source/moddb-start.html
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            --user-agent "$UA" --referer "https://www.indiedb.com/downloads/start/130316/all" \
            --cookie-jar work/source/moddb-cookies.txt --cookie work/source/moddb-cookies.txt \
            "$SOURCE_URL" -o work/source/cr-setup-0.0.9.7919f.exe
          file work/source/cr-setup-0.0.9.7919f.exe
          echo "Official ModDB installer MD5 (expected): 9e00a2b43b7140aaac57c828bd6566ce" | tee work/reports/source-verification.txt
          md5sum work/source/cr-setup-0.0.9.7919f.exe | tee -a work/reports/source-verification.txt
          ACTUAL_MD5="$(md5sum work/source/cr-setup-0.0.9.7919f.exe | awk '{print $1}')"
          if [ "$ACTUAL_MD5" != "9e00a2b43b7140aaac57c828bd6566ce" ]; then
            echo "STOP: downloaded installer does not match IndieDB/ModDB published file hash." | tee -a work/reports/source-verification.txt
            exit 11
          fi
          echo "PASS: installer MD5 matches IndieDB/ModDB published file hash." | tee -a work/reports/source-verification.txt
          innoextract --extract --output-dir work/source/unpacked work/source/cr-setup-0.0.9.7919f.exe > work/reports/innoextract.log 2>&1 || true
          if ! find work/source/unpacked -maxdepth 8 -type f -name 'Assembly-CSharp.dll' -print -quit | grep -q .; then
            7z x -y "-o$PWD/work/source/unpacked" work/source/cr-setup-0.0.9.7919f.exe > work/reports/7zip-extract.log
          fi
          GAME_DLL="$(find work/source/unpacked -maxdepth 8 -type f -name 'Assembly-CSharp.dll' -print -quit)"
          if [ -z "$GAME_DLL" ]; then
            echo "Could not extract Assembly-CSharp.dll from the installer." | tee -a work/reports/source-verification.txt
            cat work/reports/innoextract.log || true
            cat work/reports/7zip-extract.log || true
            exit 12
          fi
          echo "Assembly-CSharp.dll SHA-256:" >> work/reports/source-verification.txt
          sha256sum "$GAME_DLL" | tee -a work/reports/source-verification.txt
          EXPECTED='482f8bd6ef4546965b060463377470fc2da2db996de7ec16f29eb88f56a021b3'
          ACTUAL="$(sha256sum "$GAME_DLL" | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "STOP: official installer contains a different game assembly than the user's archive." | tee -a work/reports/source-verification.txt
            echo "Expected $EXPECTED but got $ACTUAL; do not substitute it." | tee -a work/reports/source-verification.txt
            exit 13
          fi
          echo "PASS: gameplay assembly exactly matches the user's archive." | tee -a work/reports/source-verification.txt
          printf '%s\n' "$GAME_DLL" > work/reports/game-dll-path.txt
          GAME_ROOT="$(dirname "$(find work/source/unpacked -maxdepth 8 -type f -iname 'Crisis Response.exe' -print -quit)")"
          test -n "$GAME_ROOT" -a -d "$GAME_ROOT"
          printf '%s\n' "$GAME_ROOT" > work/reports/game-root-path.txt

      - name: Decompile original managed gameplay assembly
        if: success()
        run: |
          set -euo pipefail
          dotnet tool install --global ilspycmd --version 11.1.0.9782
          GAME_DLL="$(cat work/reports/game-dll-path.txt)"
          MANAGED_DIR="$(dirname "$GAME_DLL")"
          "$HOME/.dotnet/tools/ilspycmd" --version
          "$HOME/.dotnet/tools/ilspycmd" --nested-directories -p \
            -r "$MANAGED_DIR" -o work/decompiled "$GAME_DLL" \
            2>&1 | tee work/reports/ilspy-decompilation.log
          find work/decompiled -type f -name '*.cs' | wc -l > work/reports/decompiled-csharp-file-count.txt

      - name: Build AssetRipper CLI from source
        if: success()
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/github/AssetRipper
          sudo chown -R "$USER":"$USER" /opt/github/AssetRipper
          git clone --depth 1 --branch 2.0.0 https://github.com/AssetRipper/AssetRipper.git /opt/github/AssetRipper/AssetRipper
          git clone --depth 1 https://github.com/neoedmund/AssetRipperCLI.git /opt/github/AssetRipperCLI
          dotnet publish /opt/github/AssetRipperCLI/AssetRipperCLI.csproj \
            --configuration Release --runtime linux-x64 --output "$GITHUB_WORKSPACE/work/assetripper-cli" \
            2>&1 | tee work/reports/assetripper-build.log

      - name: Recover editable Unity project and assets
        if: success()
        run: |
          set -euo pipefail
          GAME_ROOT="$(cat work/reports/game-root-path.txt)"
          chmod +x work/assetripper-cli/AssetRipperCLI
          work/assetripper-cli/AssetRipperCLI "$GAME_ROOT" work/export \
            2>&1 | tee work/reports/assetripper-export.log
          find work/export -type f | wc -l > work/reports/exported-file-count.txt
          du -sh work/export > work/reports/exported-size.txt
          find work/export -maxdepth 4 -type f \( -name 'ProjectVersion.txt' -o -name 'manifest.json' -o -name '*.unity' \) \
            | head -100 > work/reports/unity-project-landmarks.txt

      - name: Write recovery report
        if: always()
        run: |
          {
            echo "# Crisis Response recovery report"
            echo
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Source verification"
            if [ -f work/reports/source-verification.txt ]; then cat work/reports/source-verification.txt; else echo "Source verification did not complete."; fi
            echo
            echo "## Decompiled C#"
            if [ -f work/reports/decompiled-csharp-file-count.txt ]; then echo "C# files: $(cat work/reports/decompiled-csharp-file-count.txt)"; else echo "Decompilation did not complete."; fi
            echo
            echo "## Recovered Unity project"
            if [ -f work/reports/exported-file-count.txt ]; then echo "Files: $(cat work/reports/exported-file-count.txt)"; cat work/reports/exported-size.txt; else echo "Asset export did not complete."; fi
            echo
            echo "## Remaining gate"
            echo "This artifact is a recovery/decompilation result, not a finished iPhone app. WebGL compilation and mobile behavioral testing still have to pass."
          } > work/RECOVERY_SUMMARY.md
          cat work/RECOVERY_SUMMARY.md

      - name: Upload decompiled source, recovered project, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisis-response-recovery-indiedb-${{ github.run_number }}
          path: |
            work/RECOVERY_SUMMARY.md
            work/reports/
            work/decompiled/
            work/export/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
