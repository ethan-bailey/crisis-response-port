name: Audit original window renderer and material provenance once

# Read-only/private source audit; only editing this workflow triggers it.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-window-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified recovered Unity project artifact privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38582072502 --repo "$GITHUB_REPOSITORY" --name crisis-response-recovery-direct-v3-1 --dir work/recovery
      - name: Audit source window renderer components without inventing geometry
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/audit_original_window_visuals.py work/recovery/export/ExportedProject --out work/window-audit/window-renderers.json | tee work/window-audit-stdout.txt
      - name: Preserve source audit metadata privately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-window-renderer-audit
          path: |
            work/window-audit/window-renderers.json
            work/window-audit-stdout.txt
          retention-days: 30
          if-no-files-found: warn
