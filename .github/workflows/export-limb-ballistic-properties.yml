name: Recover original limb ballistic properties and armor
on:
  push:
    branches: [feature/original-projectile-limb-material-closure]
    paths: [.github/workflows/export-limb-ballistic-properties.yml]
permissions: {contents: write,actions: read}
jobs:
  recover-original-limb-materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Download pinned original project archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11903811738/zip" > /tmp/crisis-original.zip
          echo "cc94b34da675969f881df10158d6c1b9c161cbcf620b5c0aea71c0cea4bc3a1d  /tmp/crisis-original.zip" | sha256sum -c -
      - name: Extract actual original material and armor records
        run: |
          python3 scripts/export_original_limb_ballistic_materials.py /tmp/crisis-original.zip game/assets/original-character-limb-components.json game/assets/original-limb-ballistic-materials.json
      - name: Preserve source asset hashes and exact values
        run: |
          git add game/assets/original-limb-ballistic-materials.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Preserve eight original ballistic property assets and source LimbArmor values"
            git push origin HEAD:feature/original-projectile-limb-material-closure
          fi
