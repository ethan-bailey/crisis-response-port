<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crisis Response — Mission 01 runtime</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#eef2f7;touch-action:none}#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:absolute;left:12px;top:12px;max-width:min(440px,calc(100vw - 24px));padding:10px 12px;border:1px solid #505965;border-radius:9px;background:#111820e8;pointer-events:none;font-size:12px;line-height:1.4}#title{font-size:14px;font-weight:750;margin-bottom:3px}#status{color:#c5d0dc}#position{color:#a8d9ff;margin-top:4px;font-variant-numeric:tabular-nums}#controls{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:12px;pointer-events:none}.cluster{display:flex;gap:8px;pointer-events:auto}button{min-width:68px;min-height:58px;padding:10px 12px;border:1px solid #778391;border-radius:12px;background:#18222edc;color:#f6f8fa;font-size:14px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}button.active{background:#315a79;border-color:#9bd8ff}#sprint{min-width:78px}#help{position:absolute;right:12px;top:12px;padding:7px 9px;border:1px solid #505965;border-radius:8px;background:#111820e8;font-size:11px;color:#d4dde7}#error{display:none;position:absolute;left:12px;right:12px;top:92px;padding:12px;border:1px solid #a33;border-radius:8px;background:#351818;color:#ffe4e4;white-space:pre-wrap}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="hud"><div id="title">Crisis Response · Mission 01</div><div id="status">Loading recovered scene and original Operator prefab…</div><div id="position"></div></div>
<div id="help">A/D or ←/→ · Shift to sprint</div>
<div id="error"></div>
<div id="controls"><div class="cluster"><button id="left" aria-label="Move left">◀ LEFT</button><button id="right" aria-label="Move right">RIGHT ▶</button></div><div class="cluster"><button id="sprint" aria-label="Sprint">SPRINT</button></div></div>
<script type="module">
import * as THREE from "three";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

const stage=document.querySelector("#stage"), status=document.querySelector("#status"), positionLabel=document.querySelector("#position"), errorBox=document.querySelector("#error");
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x11151b);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f0ff,0x55505a,2.0));
const key=new THREE.DirectionalLight(0xffffff,1.5);key.position.set(-4,12,18);scene.add(key);
let viewHeight=11;
const camera=new THREE.OrthographicCamera(-viewHeight*innerWidth/innerHeight/2,viewHeight*innerWidth/innerHeight/2,viewHeight/2,-viewHeight/2,.1,1000);
camera.position.set(-3,2.5,60);camera.lookAt(-3,2.5,0);
const world=new THREE.Group();scene.add(world);
const character=new THREE.Group();character.name="Original Operator prefab";scene.add(character);
const keys={left:false,right:false,sprint:false};let velocity=0,loaded=false,playerX=-3,playerY=1.5,groundY=1.5,sceneBounds=null,sceneMesh=null;
function showError(e){errorBox.style.display="block";errorBox.textContent=String(e?.stack||e);status.textContent="Build failed to load; see error details."}
function setInput(id,key){const b=document.querySelector("#"+id);const on=e=>{e.preventDefault();keys[key]=true;b.classList.add("active");try{b.setPointerCapture(e.pointerId)}catch{}};const off=e=>{e.preventDefault();keys[key]=false;b.classList.remove("active")};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("lostpointercapture",off);b.addEventListener("contextmenu",e=>e.preventDefault())}
setInput("left","left");setInput("right","right");setInput("sprint","sprint");
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowleft","arrowright","a","d","shift"].includes(k))e.preventDefault();if(k==="arrowleft"||k==="a")keys.left=true;if(k==="arrowright"||k==="d")keys.right=true;if(k==="shift")keys.sprint=true});
addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(k==="arrowleft"||k==="a")keys.left=false;if(k==="arrowright"||k==="d")keys.right=false;if(k==="shift")keys.sprint=false});
addEventListener("blur",()=>{keys.left=keys.right=keys.sprint=false;document.querySelectorAll("button").forEach(b=>b.classList.remove("active"))});
function setMeshMaterials(root){root.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({color:0x858b91,roughness:1,metalness:0,side:THREE.DoubleSide});o.castShadow=false;o.receiveShadow=true}})}
async function load(){
 try{
  const [objResponse,manifestResponse]=await Promise.all([fetch("./assets/mission01.obj"),fetch("./assets/operator/operator.json")]);
  if(!objResponse.ok)throw new Error("Mission 01 geometry missing: HTTP "+objResponse.status);
  if(!manifestResponse.ok)throw new Error("Original Operator manifest missing: HTTP "+manifestResponse.status);
  const manifest=await manifestResponse.json();
  const objText=await objResponse.text();
  sceneMesh=new OBJLoader().parse(objText);setMeshMaterials(sceneMesh);sceneMesh.name="Recovered Mission 01 combined mesh";world.add(sceneMesh);
  sceneBounds=new THREE.Box3().setFromObject(sceneMesh);
  const texLoader=new THREE.TextureLoader();
  let textured=0;
  for(const limb of manifest.limbs){
   const g=new THREE.PlaneGeometry(1,1);
   let material;
   if(limb.texture){const tex=await texLoader.loadAsync("./assets/operator/"+limb.texture);tex.colorSpace=THREE.SRGBColorSpace;material=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.025,side:THREE.DoubleSide,depthWrite:false});textured++}
   else material=new THREE.MeshBasicMaterial({color:0x777777,side:THREE.DoubleSide,transparent:true,opacity:.8,depthWrite:false});
   const part=new THREE.Mesh(g,material);part.name=limb.name;
   part.position.fromArray(limb.position);part.quaternion.fromArray(limb.rotation);part.scale.fromArray(limb.scale);part.renderOrder=Math.round((part.position.z+10)*10);
   character.add(part);
  }
  character.position.set(-3,1.5,1.5);
  const box=sceneBounds;const size=box.getSize(new THREE.Vector3());viewHeight=Math.max(8,Math.min(13,size.y*.75||11));
  camera.left=-viewHeight*innerWidth/innerHeight/2;camera.right=viewHeight*innerWidth/innerHeight/2;camera.top=viewHeight/2;camera.bottom=-viewHeight/2;camera.updateProjectionMatrix();
  groundY=1.5;loaded=true;
  status.textContent="Recovered Mission 01 geometry + original Operator limb textures. Horizontal movement uses recovered walk/sprint speeds; original animation, physics, weapons and AI are not yet running.";
  positionLabel.textContent="Walk 1.2 m/s · Sprint 3.2 m/s · original spawn X −3";
 }catch(e){showError(e)}
}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.left=-viewHeight*innerWidth/innerHeight/2;camera.right=viewHeight*innerWidth/innerHeight/2;camera.top=viewHeight/2;camera.bottom=-viewHeight/2;camera.updateProjectionMatrix()}
addEventListener("resize",resize);
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(loaded){
 const dir=(keys.right?1:0)-(keys.left?1:0), maxSpeed=keys.sprint?3.2:1.2;
 if(dir){velocity+=(dir*maxSpeed-velocity)*Math.min(1,15*dt);character.scale.x=dir<0?-1:1}
 else velocity*=Math.exp(-5.5*dt);
 if(Math.abs(velocity)<.015)velocity=0;
 playerX+=velocity*dt;character.position.x=playerX;
 camera.position.x+=(playerX-camera.position.x)*Math.min(1,5*dt);
 camera.position.y+=(2.6-camera.position.y)*Math.min(1,3*dt);camera.lookAt(camera.position.x,2.6,0);
 positionLabel.textContent="X "+playerX.toFixed(2)+" · speed "+Math.abs(velocity).toFixed(2)+" m/s"+(keys.sprint?" · sprint":"");
 }renderer.render(scene,camera)}
requestAnimationFrame(frame);load();
</script>
</body>
</html>
