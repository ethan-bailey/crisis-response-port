   if(limb.texture){const tex=await texture("./assets/operator/"+limb.texture);material=sourceCutoutMaterial(tex,cutoutMaterials.operator[limb.gameObjectFileID]);textured++}
   else material=new THREE.MeshBasicMaterial({color:0x777777,side:THREE.DoubleSide,transparent:true,opacity:.8,depthWrite:false});
   const part=new THREE.Mesh(g,material);part.name="Original skin: "+limb.name;part.renderOrder=1;parent.add(part);
  })).then(()=>markLoaded("skinsReady"));

  const handsReady=handRenderDataReady.then(data=>createOriginalHandRenderers(data,nodeById,texture)).then(view=>{handRenderers=view;markLoaded("handsReady");});

  async function buildWeapon(name,pivotPath){
   const data=await json("./assets/weapons/"+name+"/weapon.json"),byId=new Map(),byPath=new Map();
   for(const node of data.nodes){const group=new THREE.Group();group.name=node.name;group.position.fromArray(node.position);group.quaternion.fromArray(node.rotation);group.scale.fromArray(node.scale);byId.set(node.gameObjectFileID,group);byPath.set(node.path,group)}
   const rootNode=data.nodes.find(n=>!n.parentGameObjectFileID),root=byId.get(rootNode.gameObjectFileID);
   root.position.set(0,0,0);
   for(const node of data.nodes){const group=byId.get(node.gameObjectFileID);if(node.parentGameObjectFileID){const parent=byId.get(node.parentGameObjectFileID);if(parent)parent.add(group)}}
   await Promise.all(data.renderers.map(async rendererData=>{const parent=byId.get(rendererData.gameObjectFileID);if(!parent)return;let material;
    if(rendererData.texture){const tex=await texture("./assets/weapons/"+name+"/"+rendererData.texture);material=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.015,side:THREE.DoubleSide,depthWrite:false})}
    else material=new THREE.MeshBasicMaterial({color:0x30343a,side:THREE.DoubleSide,transparent:true,depthWrite:false});
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);mesh.name="Original "+name+" component: "+rendererData.name;parent.add(mesh);
   }));
   const pivot=nodeByPath.get(pivotPath);if(!pivot)throw new Error("Original weapon pivot not found: "+pivotPath);pivot.add(root);
   return {name,root,nodesByPath:byPath,stats:data.stats};
  }
  const activeWeaponReady=buildWeapon("M4A1","Pelvis/Abdomen/Torso/Rifle pivot").then(w=>{weaponInstances.M4A1=w;markLoaded("activeWeaponReady");});
  const characterReady=Promise.all([skinReady,activeWeaponReady,handsReady]);characterReady.catch(()=>{});
  // Original weapon action state machines are not executable yet. Preserve the
  // recovered models without inventing ammo counters, reload timers or shot rays.
  weaponStatus.textContent="Original M4 mechanics ready";
  const clips=animationData.clips;
  let activeAnimation="Body stand",animationTime=0;
  const sourceAnimator=new SourceCharacterAnimator(animatorControllerGraph);
  function sample(track,time){
   const ks=track.keys;if(ks.length===1||time<=ks[0].time)return ks[0].value;
   if(time>=ks[ks.length-1].time)return ks[ks.length-1].value;
   let i=0;while(i<ks.length-1&&ks[i+1].time<time)i++;
   const a=ks[i],b=ks[i+1],alpha=(time-a.time)/Math.max(1e-8,b.time-a.time);
   if(track.property==="rotation"){const qa=new THREE.Quaternion(...a.value),qb=new THREE.Quaternion(...b.value),q=new THREE.Quaternion();q.slerpQuaternions(qa,qb,alpha);return q.toArray()}
   return new THREE.Vector3(...a.value).lerp(new THREE.Vector3(...b.value),alpha).toArray();
  }
  const animatedBindings=new Map(Object.values(clips).flatMap(c=>c.tracks).map(t=>[t.path+"|"+t.property,t]));
  function resetPose(){for(const track of animatedBindings.values()){
   const group=nodeByPath.get(track.path);if(!group)continue;
   const node=manifest.nodes.find(n=>n.path===track.path),base=baseTransforms.get(node.gameObjectFileID);
   if(track.property==="position")group.position.copy(base.position);else if(track.property==="rotation")group.quaternion.copy(base.quaternion);else group.scale.copy(base.scale);
  }}
  function samplePose(track,time,clip){const value=sample(track,time);return track.property==="position"?posePosition(track,value,clip,animationData.animator.applyRootMotion):value;}
  function applyTrack(track,time,clip){const group=nodeByPath.get(track.path);if(!group)return;const value=samplePose(track,time,clip);if(track.property==="rotation")group.quaternion.fromArray(value);else if(track.property==="position")group.position.fromArray(value);else if(track.property==="scale")group.scale.fromArray(value)}
  applyAnimation=async function(dt){
   // Execute the exact recovered CharacterBody.UpdateAnimation() C# formulas
   // on the LIVE weapon/operator host, not an unrelated test-only instance.
   const original=JSON.parse(await runtimeCall("StepCharacterAnimation",JSON.stringify({
    kneeling:isKneeling,moving:Math.abs(velocity)>.15,
    backwards:Math.abs(velocity)>.15&&Math.sign(velocity)!==facingDirection,
    velocity,walkSpeed:contactPhysics.data.character.movement.walkSpeed,
    sprintSpeed:contactPhysics.data.character.movement.sprintSpeed,
    crippledRatio:0,operator:true,deltaTime:dt,colliderVerticalOffset:-.725
   })));
   if(original.ragdoll){return;} // PhysX owns bones after original source ragdoll.
   const timeline=sourceAnimator.step(dt,{
    Moving:original.moving,Backwards:original.backwards,
    MoveSpeed:original.moveSpeed,KneelRatio:original.KneelRatio,
    CrippledRatio:original.crippled
   });
   const selected=timeline.clips;
   activeAnimation=selected.reduce((best,c)=>!best||c.weight>best.weight?c:best,null)?.clip??"Body stand";
   animationTime+=dt;
   sprintBlend=selected.filter(c=>c.clip==="Body sprint").reduce((a,c)=>a+c.weight,0);
   gaitPhase=(gaitPhase+dt)%1;
   // The original controller mixes recovered AnimationClip tracks using
   // the authored state/transition weights and authored blend thresholds.
   resetPose();
   const mixed=new Map();
   for(const item of selected){
    const clip=clips[item.clip];if(!clip||item.weight<=0)continue;
    const time=clip.duration>0?(clip.loop?item.time%clip.duration:Math.min(item.time,clip.duration)):0;
    for(const track of clip.tracks){
     const key=track.path+"|"+track.property;
     const arr=samplePose(track,time,clip);
     const value=track.property==="rotation"?new THREE.Quaternion(...arr):new THREE.Vector3(...arr);
     const existing=mixed.get(key);
     if(!existing){mixed.set(key,{track,value,weight:item.weight});continue}
     const frac=item.weight/(existing.weight+item.weight);
     if(track.property==="rotation")existing.value.slerp(value,frac);
     else existing.value.lerp(value,frac);
     existing.weight+=item.weight;
    }
   }
   for(const {track,value,weight} of mixed.values()){
    const group=nodeByPath.get(track.path);if(!group)continue;
    const node=manifest.nodes.find(n=>n.path===track.path);
    const base=node&&baseTransforms.get(node.gameObjectFileID);
    if(!base)continue;
    if(track.property==="rotation")group.quaternion.copy(base.quaternion).slerp(value,Math.min(1,weight));
    else if(track.property==="position")group.position.copy(base.position).lerp(value,Math.min(1,weight));
    else group.scale.copy(base.scale).lerp(value,Math.min(1,weight));
   }
  };
  rightUpperArm=nodeByPath.get("Pelvis/Abdomen/Torso/Right upper arm")||null;
  // WeaponPointer raycasts only against the original AimQuad layer. Its prefab is a 25×5
  // plane at z=-1.5; reproduce that actual target collider for pointer-to-world mapping.
  await presentationReady;
  aimQuad=new THREE.Mesh(new THREE.PlaneGeometry(...presentationData.aimQuadSize),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,colorWrite:false}));
  aimQuad.name="Original Aim quad collider (layer AimQuad)";aimQuad.rotation.x=Math.PI;aimQuad.position.set(playerX+facingDirection*20,2.5,1.5);scene.add(aimQuad);
  await Promise.all([startupReady,characterReady]);
  const originalWindows=JSON.parse(await runtimeCall('OriginalWindowVisuals'));
  const originalParticleSources=await particleSourceReady;
  armRig=await createOriginalArmRig(await armPhysicsReady,nodeById,character);
  upperBody=createUpperBody(presentationData,manifest,nodeById,character,weaponInstances.M4A1,runtimeCall,weaponData,scene,ballisticsData,originalWindows,originalParticleSources,armRig);
  physicsState=contactPhysics.snapshot();document.body.classList.add('playing');loaded=true;markLoaded("playable");
  // The inactive sidearm must not delay play. Fetch it after the first playable frame.
  requestAnimationFrame(()=>setTimeout(()=>buildWeapon("Glock-18","Pelvis/Abdomen/Torso/Right upper arm/Right lower arm/Right hand/Pistol pivot").then(w=>{w.root.visible=false;weaponInstances["Glock-18"]=w;markLoaded("sidearmReady");}).catch(()=>{weaponStatus.textContent="Original active weapon loaded · sidearm preview unavailable";}),0));
  window.__gameState=()=>({loaded,originalInputActive:!!runtimeCall,originalInput:originalInputState,playerX,playerY,velocity,pelvisLocalPosition:nodeByPath.get("Pelvis").position.toArray(),physics:physicsState,physicsTime,sprintBlend,gaitPhase,loadingTimings,presentation:upperBody.snapshot(),originalPhysicalArms:armRig?.snapshot(),originalHands:handRenderers?.snapshot(),projection:{type:camera.type,fov:camera.fov,near:camera.near,far:camera.far,position:camera.position.toArray()},facingDirection,aimPoint:[aimPoint.x,aimPoint.y,physicsState.z],limbCount:manifest.limbs.length,sceneMesh:!!sceneMesh,animation:activeAnimation,weapon:activeWeaponName,weaponActionsImplemented:true,weaponState,aimDirection:lockedAim.vector,weaponsLoaded:Object.keys(weaponInstances).length===2,sceneBounds:sceneBounds?{min:sceneBounds.min.toArray(),max:sceneBounds.max.toArray()}:null});
  status.textContent="Original C# camera and arm IK · tap or drag to aim; tap same spot to fire.";
  positionLabel.textContent="Walk 1.5 m/s · Sprint 4.2 m/s · original spawn X −3";
 }catch(e){showError(e)}
}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();document.querySelector("#rotateNotice").style.display=innerWidth<innerHeight?"flex":"none"}
addEventListener("resize",resize);document.querySelector("#rotateNotice").style.display=innerWidth<innerHeight?"flex":"none";
function updateAim(e){
 hasAimPointer=true;aimDirty=true;
 const rect=renderer.domElement.getBoundingClientRect();
 pointerNdc.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointerNdc.y=-(((e.clientY-rect.top)/rect.height)*2-1);
}
input.bindAim(renderer.domElement, updateAim,()=>{tapPending++;});

let last=null,frameBusy=false,lastBusyRender=-Infinity;
async function frame(now){
 requestAnimationFrame(frame);
 if(frameBusy){
  // Original M4 sprite flash/impact meshes already carry the latest C# pose.
  // The old scheduler discarded EVERY rAF while async .NET was processing,
  // often dropping the only visible frame of a short original muzzle flash.
  // Repaint the unchanged scene at up to 30fps without advancing any source
  // physics, Unity Time.time, gameplay or recovered animation frame.
  if(loaded && now-lastBusyRender>=33){
   renderer.render(scene,camera);
   lastBusyRender=now;
  }
  return;
 }const elapsed=last===null?0:(now-last)/1000;const dt=Math.min(elapsed,.05);last=now;if(loaded){frameBusy=true;try{
 if(tapFrame){rawActions.fire=false;tapFrame=false;}else if(tapPending>0){tapPending--;rawActions.fire=true;tapFrame=true;}else rawActions.fire=input.pressed('fire');
 rawActions.magazine=reloadPending||input.pressed("magazine");reloadPending=false;
 originalInputState=JSON.parse(await runtimeCall("Tick",elapsed,JSON.stringify(rawActions)));
 for(const action of Object.keys(keys))keys[action]=originalInputState[action].Pressed;
 if(originalInputState.kneel.Down)isKneeling=true;else if(originalInputState.stand.Down)isKneeling=false;
 // PlayerController.Update(): left takes precedence, then Body.Move(direction).
 let dir=0;
 if(keys.left)dir=-1;else if(keys.right)dir=1;
 if(dir!==0)acceleration=dir;
 fixedAccumulator+=dt;
 while(fixedAccumulator>=contactPhysics.data.fixedDeltaTime){
  const step=contactPhysics.data.fixedDeltaTime;
  // Direct port of CharacterBody.FixedUpdate() for the recovered Operator prefab.
  if(acceleration!==0){
   // Execute recovered CharacterBody.Move / FixedUpdate source logic in C#.
   // This adapter transports the resulting force to the real PhysX actor.
   const walkSpeed=contactPhysics.data.character.movement.walkSpeed;
   const sprintSpeed=contactPhysics.data.character.movement.sprintSpeed;
   const motion=input.movementProfile(Math.sign(acceleration),walkSpeed,sprintSpeed,keys.sprint);
   const movement=JSON.parse(await runtimeCall("StepBodyMovement",JSON.stringify({
    direction:acceleration,velocity,step,facing:facingDirection,
    walkSpeed,sprintSpeed,analogMagnitude:motion.magnitude,
    sprint:motion.sprint,crippled:false,operator:true,noPlayerLimp:true,precision:false
   })));
   if(movement.forceX!==0)contactPhysics.addAcceleration(movement.forceX);
   if(movement.reset)acceleration=0;
  }
  // PhysX integrates gravity, contacts and friction even without movement input.
  contactPhysics.setPoseState(isKneeling,facingDirection,step);
  physicsState=contactPhysics.step(step);physicsTime+=step;
  playerX=physicsState.x;playerY=physicsState.y;velocity=physicsState.velocity;
  fixedAccumulator-=step;
 }
 character.position.set(playerX,playerY,physicsState.z);
 await applyAnimation(dt);
 character.updateWorldMatrix(true,true);
 // WeaponPointer.Update(): move the AimQuad from the operator, raycast the pointer against
 // that collider, retain its body-local hit point, then reconstruct WorldPoint from the body.
 if(aimQuad){
  aimQuad.position.set(playerX+facingDirection*20,2.5,1.5);
  character.updateMatrixWorld(true);aimQuad.updateMatrixWorld(true);camera.updateMatrixWorld(true);
  aimRaycaster.setFromCamera(pointerNdc,camera);
  const shoulder=rightUpperArm.getWorldPosition(new THREE.Vector3());
  if(aimDirty){
   const hit=aimRaycaster.intersectObject(aimQuad,false)[0];
   if(hit)lockedAim.set(hit.point.toArray(),shoulder.toArray());
   aimDirty=false;
  }
  const worldPoint=new THREE.Vector3(...lockedAim.target(shoulder.toArray()));
  aimPoint.set(worldPoint.x,worldPoint.y);
  facingDirection=lockedAim.vector[0]>=0?1:-1;
  character.rotation.y=facingDirection<0?Math.PI:0;
  aimQuad.position.set(playerX+facingDirection*20,2.5,1.5);
 }
 await upperBody.update({position:new THREE.Vector3(playerX,playerY,physicsState.z),velocity,direction:facingDirection,moving:Math.abs(velocity)>.1,sprinting:keys.sprint,kneeling:isKneeling,aim:new THREE.Vector3(aimPoint.x,aimPoint.y,physicsState.z),aspect:camera.aspect,fire:keys.fire,reload:originalInputState.magazine.Down,physicsStep:contactPhysics.data.fixedDeltaTime},camera);
 weaponState=upperBody.weaponSnapshot();magazineHud.render(weaponState);weaponStatus.textContent=(weaponState.weaponId??"Equipped weapon")+" · "+weaponState.magazine+" + "+(weaponState.chamberLive?1:0)+" · reserve "+weaponState.reserve+(weaponState.reloading?" · reloading":"");
 positionLabel.textContent="X "+playerX.toFixed(2)+" · speed "+Math.abs(velocity).toFixed(2)+" m/s"+(keys.sprint?" · sprint input":"");
 }catch(error){loaded=false;showError(error)}finally{frameBusy=false;}}renderer.render(scene,camera)}
requestAnimationFrame(frame);load();
