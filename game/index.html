<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crisis Response — Mission 01 runtime</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#eef2f7;touch-action:none}#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:absolute;left:12px;top:12px;max-width:min(440px,calc(100vw - 24px));padding:10px 12px;border:1px solid #505965;border-radius:9px;background:#111820e8;pointer-events:none;font-size:12px;line-height:1.4}#title{font-size:14px;font-weight:750;margin-bottom:3px}#status{color:#c5d0dc}#position{color:#a8d9ff;margin-top:4px;font-variant-numeric:tabular-nums}#weaponStatus{color:#ffd9a3;margin-top:3px;font-weight:700}#controls{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:12px;pointer-events:none} .cluster{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;max-width:52vw;justify-content:flex-end}button{min-width:56px;min-height:54px;padding:10px 12px;border:1px solid #778391;border-radius:12px;background:#18222edc;color:#f6f8fa;font-size:14px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}button.active{background:#315a79;border-color:#9bd8ff}#sprint{min-width:60px}#reload{min-width:64px}#help{position:absolute;right:12px;top:12px;padding:7px 9px;border:1px solid #505965;border-radius:8px;background:#111820e8;font-size:11px;color:#d4dde7}#error{display:none;position:absolute;left:12px;right:12px;top:92px;padding:12px;border:1px solid #a33;border-radius:8px;background:#351818;color:#ffe4e4;white-space:pre-wrap}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="hud"><div id="title">Crisis Response · Mission 01</div><div id="status">Loading recovered scene and original Operator prefab…</div><div id="position"></div><div id="weaponStatus">Loading original weapons…</div></div>
<div id="help">A/D · Shift sprint · drag to aim · hold FIRE · R reload · Q swap</div>
<div id="error"></div>
<div id="controls"><div class="cluster"><button id="left" aria-label="Move left">◀ LEFT</button><button id="right" aria-label="Move right">RIGHT ▶</button></div><div class="cluster"><button id="sprint" aria-label="Sprint">SPRINT</button><button id="fire" aria-label="Fire weapon">FIRE</button><button id="reload" aria-label="Reload weapon">RELOAD</button><button id="swap" aria-label="Swap weapon">SWAP</button></div></div>
<script type="module">
import * as THREE from "three";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

const stage=document.querySelector("#stage"), status=document.querySelector("#status"), positionLabel=document.querySelector("#position"), errorBox=document.querySelector("#error");
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x11151b);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f0ff,0x55505a,2.0));
const key=new THREE.DirectionalLight(0xffffff,1.5);key.position.set(-4,12,18);scene.add(key);
let viewHeight=11;
const camera=new THREE.OrthographicCamera(-viewHeight*innerWidth/innerHeight/2,viewHeight*innerWidth/innerHeight/2,viewHeight/2,-viewHeight/2,.1,1000);
camera.position.set(-3,2.5,60);camera.lookAt(-3,2.5,0);
const world=new THREE.Group();scene.add(world);
const character=new THREE.Group();character.name="Original Operator prefab";scene.add(character);
const keys={left:false,right:false,sprint:false};let velocity=0,loaded=false,playerX=-3,playerY=1.5,groundY=1.5,sceneBounds=null,sceneMesh=null,facingDirection=1,acceleration=0,fixedAccumulator=0,applyAnimation=()=>{},rightUpperArm=null,aimQuad=null,localAimPoint=new THREE.Vector3(),aimRaycaster=new THREE.Raycaster(),pointerNdc=new THREE.Vector2(0,0),pointerHasMoved=false;
function showError(e){errorBox.style.display="block";errorBox.textContent=String(e?.stack||e);status.textContent="Build failed to load; see error details."}
function setInput(id,key){const b=document.querySelector("#"+id);const on=e=>{e.preventDefault();keys[key]=true;b.classList.add("active");};const off=e=>{e.preventDefault();keys[key]=false;b.classList.remove("active")};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("contextmenu",e=>e.preventDefault())}
setInput("left","left");setInput("right","right");setInput("sprint","sprint");setInput("fire","fire");
document.querySelector("#reload").addEventListener("click",()=>reloadWeapon());
document.querySelector("#swap").addEventListener("click",()=>swapWeapon());
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowleft","arrowright","a","d","shift","r","q","1","2"].includes(k))e.preventDefault();if(k==="arrowleft"||k==="a")keys.left=true;if(k==="arrowright"||k==="d")keys.right=true;if(k==="shift")keys.sprint=true;if(k==="r")reloadWeapon();if(k==="q")swapWeapon();if(k==="1")swapToWeapon("M4A1");if(k==="2")swapToWeapon("Glock-18")});
addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(k==="arrowleft"||k==="a")keys.left=false;if(k==="arrowright"||k==="d")keys.right=false;if(k==="shift")keys.sprint=false});
addEventListener("blur",()=>{keys.left=keys.right=keys.sprint=keys.fire=false;firePressed=false;document.querySelectorAll("button").forEach(b=>b.classList.remove("active"))});
function setMeshMaterials(root){root.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({color:0x858b91,roughness:1,metalness:0,side:THREE.DoubleSide});o.castShadow=false;o.receiveShadow=true}})}
async function load(){
 try{
  const [objResponse,manifestResponse,animationResponse,m4Response,glockResponse]=await Promise.all([fetch("./assets/mission01.obj"),fetch("./assets/operator/operator.json"),fetch("./assets/operator/animations.json"),fetch("./assets/weapons/M4A1/weapon.json"),fetch("./assets/weapons/Glock-18/weapon.json")]);
  if(!objResponse.ok)throw new Error("Mission 01 geometry missing: HTTP "+objResponse.status);
  if(!manifestResponse.ok)throw new Error("Original Operator manifest missing: HTTP "+manifestResponse.status);
  if(!animationResponse.ok)throw new Error("Original Operator animation data missing: HTTP "+animationResponse.status);
  if(!m4Response.ok||!glockResponse.ok)throw new Error("Original M4A1/Glock weapon manifest is missing.");
  const manifest=await manifestResponse.json();
  const animationData=await animationResponse.json();
  const weaponData={"M4A1":await m4Response.json(),"Glock-18":await glockResponse.json()};
  const objText=await objResponse.text();
  sceneMesh=new OBJLoader().parse(objText);setMeshMaterials(sceneMesh);sceneMesh.name="Recovered Mission 01 combined mesh";world.add(sceneMesh);
  sceneBounds=new THREE.Box3().setFromObject(sceneMesh);
  const texLoader=new THREE.TextureLoader();
  const nodeById=new Map(),nodeByPath=new Map(),baseTransforms=new Map();
  for(const node of manifest.nodes){
   const group=new THREE.Group();group.name=node.name;group.position.fromArray(node.position);group.quaternion.fromArray(node.rotation);group.scale.fromArray(node.scale);
   nodeById.set(node.gameObjectFileID,group);nodeByPath.set(node.path,group);
   baseTransforms.set(node.gameObjectFileID,{position:group.position.clone(),quaternion:group.quaternion.clone(),scale:group.scale.clone()});
  }
  for(const node of manifest.nodes){
   const group=nodeById.get(node.gameObjectFileID),parent=node.parentGameObjectFileID?nodeById.get(node.parentGameObjectFileID):null;
   (parent||character).add(group);
  }
  let textured=0;
  for(const limb of manifest.limbs){
   const parent=nodeById.get(limb.gameObjectFileID);if(!parent)continue;
   const g=new THREE.PlaneGeometry(1,1);let material;
   if(limb.texture){const tex=await texLoader.loadAsync("./assets/operator/"+limb.texture);tex.colorSpace=THREE.SRGBColorSpace;material=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.025,side:THREE.DoubleSide,depthWrite:false});textured++}
   else material=new THREE.MeshBasicMaterial({color:0x777777,side:THREE.DoubleSide,transparent:true,opacity:.8,depthWrite:false});
   const part=new THREE.Mesh(g,material);part.name="Original skin: "+limb.name;part.renderOrder=1;parent.add(part);
  }
  const weaponStatus=document.querySelector("#weaponStatus");
  async function buildWeapon(name,pivotPath){
   const data=weaponData[name],byId=new Map(),byPath=new Map();
   for(const node of data.nodes){const group=new THREE.Group();group.name=node.name;group.position.fromArray(node.position);group.quaternion.fromArray(node.rotation);group.scale.fromArray(node.scale);byId.set(node.gameObjectFileID,group);byPath.set(node.path,group)}
   const rootNode=data.nodes.find(n=>!n.parentGameObjectFileID),root=byId.get(rootNode.gameObjectFileID);
   root.position.set(0,0,0);
   for(const node of data.nodes){const group=byId.get(node.gameObjectFileID);if(node.parentGameObjectFileID){const parent=byId.get(node.parentGameObjectFileID);if(parent)parent.add(group)}}
   for(const rendererData of data.renderers){const parent=byId.get(rendererData.gameObjectFileID);if(!parent)continue;let material;
    if(rendererData.texture){const tex=await texLoader.loadAsync("./assets/weapons/"+name+"/"+rendererData.texture);tex.colorSpace=THREE.SRGBColorSpace;material=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.015,side:THREE.DoubleSide,depthWrite:false})}
    else material=new THREE.MeshBasicMaterial({color:0x30343a,side:THREE.DoubleSide,transparent:true,depthWrite:false});
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);mesh.name="Original "+name+" component: "+rendererData.name;parent.add(mesh);
   }
   const pivot=nodeByPath.get(pivotPath);if(!pivot)throw new Error("Original weapon pivot not found: "+pivotPath);pivot.add(root);
   return {name,root,nodesByPath:byPath,stats:data.stats};
  }
  weaponInstances["M4A1"]=await buildWeapon("M4A1","Pelvis/Abdomen/Torso/Rifle pivot");
  weaponInstances["Glock-18"]=await buildWeapon("Glock-18","Pelvis/Abdomen/Torso/Pistol pivot");
  weaponInstances["Glock-18"].root.visible=false;
  function updateWeaponStatus(){const cap=capacityByWeapon[activeWeaponName],count=ammoByWeapon[activeWeaponName];weaponStatus.textContent=activeWeaponName+" · "+count+"/"+cap+(weaponReloading?" · RELOADING":"")}
  swapToWeapon=function(name){if(!weaponInstances[name])return;activeWeaponName=name;for(const [n,w] of Object.entries(weaponInstances))w.root.visible=n===name;weaponReloading=false;updateWeaponStatus()};
  swapWeapon=()=>swapToWeapon(activeWeaponName==="M4A1"?"Glock-18":"M4A1");
  reloadWeapon=()=>{if(weaponReloading||ammoByWeapon[activeWeaponName]===capacityByWeapon[activeWeaponName])return;weaponReloading=true;updateWeaponStatus();const delay=(weaponInstances[activeWeaponName]?.stats.reloadTime||1)*1000;setTimeout(()=>{ammoByWeapon[activeWeaponName]=capacityByWeapon[activeWeaponName];weaponReloading=false;updateWeaponStatus()},delay)};
  updateWeaponStatus();
  updateWeaponAim=()=>{const weapon=weaponInstances[activeWeaponName];if(!weapon)return;character.updateMatrixWorld(true);const pivot=weapon.root.parent;if(!pivot)return;const p=pivot.getWorldPosition(new THREE.Vector3());const worldAngle=Math.atan2(aimPoint.y-p.y,aimPoint.x-p.x);const q=pivot.getWorldQuaternion(new THREE.Quaternion()),e=new THREE.Euler().setFromQuaternion(q,"XYZ");weapon.root.rotation.z=(facingDirection>0?worldAngle:Math.PI-worldAngle)-e.z;};
  fireWeapon=()=>{if(!loaded||weaponReloading||ammoByWeapon[activeWeaponName]<=0)return;const weapon=weaponInstances[activeWeaponName];if(!weapon)return;const now=performance.now(),rpm=weapon.stats.roundsPerMinute||600;if(now-lastShotAt[activeWeaponName]<60000/rpm)return;lastShotAt[activeWeaponName]=now;ammoByWeapon[activeWeaponName]--;updateWeaponStatus();character.updateMatrixWorld(true);sceneMesh.updateMatrixWorld(true);const muzzle=weapon.nodesByPath.get("Transform/Slots/Muzzle");const origin=muzzle?muzzle.getWorldPosition(new THREE.Vector3()):weapon.root.getWorldPosition(new THREE.Vector3());const direction=new THREE.Vector3(aimPoint.x-origin.x,aimPoint.y-origin.y,0).normalize();const ray=new THREE.Raycaster(origin,direction,0,80);const hit=ray.intersectObject(sceneMesh,true).find(h=>h.distance>.1);const end=hit?hit.point:origin.clone().addScaledVector(direction,80);const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([origin,end]),new THREE.LineBasicMaterial({color:0xffd58a,transparent:true,opacity:.9}));scene.add(line);setTimeout(()=>{scene.remove(line);line.geometry.dispose();line.material.dispose()},70)};
  const clips=animationData.clips;
  let activeAnimation="Body stand",animationTime=0;
  function sample(track,time){
   const ks=track.keys;if(ks.length===1||time<=ks[0].time)return ks[0].value;
   if(time>=ks[ks.length-1].time)return ks[ks.length-1].value;
   let i=0;while(i<ks.length-1&&ks[i+1].time<time)i++;
   const a=ks[i],b=ks[i+1],alpha=(time-a.time)/Math.max(1e-8,b.time-a.time);
   if(track.property==="rotation"){const qa=new THREE.Quaternion(...a.value),qb=new THREE.Quaternion(...b.value),q=new THREE.Quaternion();q.slerpQuaternions(qa,qb,alpha);return q.toArray()}
   return new THREE.Vector3(...a.value).lerp(new THREE.Vector3(...b.value),alpha).toArray();
  }
  function resetPose(){for(const node of manifest.nodes){const group=nodeById.get(node.gameObjectFileID),base=baseTransforms.get(node.gameObjectFileID);group.position.copy(base.position);group.quaternion.copy(base.quaternion);group.scale.copy(base.scale)}}
  function applyTrack(track,time){if(track.property==="position"&&track.path==="Pelvis")return;const group=nodeByPath.get(track.path);if(!group)return;const value=sample(track,time);if(track.property==="rotation")group.quaternion.fromArray(value);else if(track.property==="position")group.position.fromArray(value);else if(track.property==="scale")group.scale.fromArray(value)}
  applyAnimation=function(dt){
   const moving=Math.abs(velocity)>.15;
   const backwards=moving&&Math.sign(velocity)!==facingDirection;
   const next=moving?(backwards?"Body walk backward":"Body walk"):"Body stand";
   if(next!==activeAnimation){activeAnimation=next;animationTime=0}
   const clip=clips[activeAnimation];if(!clip)return;
   animationTime+=dt;
   const t=clip.duration>0?(clip.loop?animationTime%clip.duration:Math.min(animationTime,clip.duration)):0;
   resetPose();
   if(activeAnimation==="Body walk"&&clips["Body sprint"]){
    const sprint=clips["Body sprint"],blend=Math.max(0,Math.min(.5,(Math.abs(velocity)-1.5)/(4.2-1.5)*.5));
    const walkMap=new Map(clip.tracks.map(tr=>[tr.path+"|"+tr.property,tr]));
    const sprintMap=new Map(sprint.tracks.map(tr=>[tr.path+"|"+tr.property,tr]));
    for(const [keyId,tr] of walkMap){
     if(tr.path==="Pelvis"&&tr.property==="position")continue;
     const other=sprintMap.get(keyId);if(!other){applyTrack(tr,t);continue}
     const a=sample(tr,t),b=sample(other,sprint.duration>0?(animationTime%sprint.duration):0),group=nodeByPath.get(tr.path);if(!group)continue;
     if(tr.property==="rotation"){const q=new THREE.Quaternion(...a).slerp(new THREE.Quaternion(...b),blend);group.quaternion.copy(q)}
     else {const v=new THREE.Vector3(...a).lerp(new THREE.Vector3(...b),blend);if(tr.property==="position")group.position.copy(v);else group.scale.copy(v)}
    }
   }else for(const track of clip.tracks)applyTrack(track,t);
  };
  rightUpperArm=nodeByPath.get("Pelvis/Abdomen/Torso/Right upper arm")||null;
  // WeaponPointer raycasts only against the original AimQuad layer. Its prefab is a 25×5
  // plane at z=-1.5; reproduce that actual target collider for pointer-to-world mapping.
  aimQuad=new THREE.Mesh(new THREE.PlaneGeometry(25,5),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,colorWrite:false}));
  aimQuad.name="Original Aim quad collider (layer AimQuad)";aimQuad.rotation.x=Math.PI;aimQuad.position.set(playerX+facingDirection*20,2.5,-1.5);scene.add(aimQuad);
  const box=sceneBounds;const size=box.getSize(new THREE.Vector3());viewHeight=Math.max(8,Math.min(13,size.y*.75||11));
  camera.left=-viewHeight*innerWidth/innerHeight/2;camera.right=viewHeight*innerWidth/innerHeight/2;camera.top=viewHeight/2;camera.bottom=-viewHeight/2;camera.updateProjectionMatrix();
  groundY=1.5;loaded=true;
  window.__gameState=()=>({loaded,playerX,facingDirection,aimPoint:character.localToWorld(localAimPoint.clone()).toArray(),limbCount:manifest.limbs.length,sceneMesh:!!sceneMesh,animation:activeAnimation,sceneBounds:sceneBounds?{min:sceneBounds.min.toArray(),max:sceneBounds.max.toArray()}:null});
  status.textContent="Recovered Mission 01 and Operator assets. Movement uses recovered CharacterBody force logic and prefab speeds. Pointer aiming now follows the recovered WeaponPointer AimQuad raycast and PlayerController shoulder-based turn check. Full Unity physics, limb flip attachments, weapons, and AI remain unported.";
  positionLabel.textContent="Walk 1.5 m/s · Sprint 4.2 m/s · original spawn X −3";
 }catch(e){showError(e)}
}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.left=-viewHeight*innerWidth/innerHeight/2;camera.right=viewHeight*innerWidth/innerHeight/2;camera.top=viewHeight/2;camera.bottom=-viewHeight/2;camera.updateProjectionMatrix()}
addEventListener("resize",resize);
function updateAim(e){
 const rect=renderer.domElement.getBoundingClientRect();
 pointerNdc.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointerNdc.y=-(((e.clientY-rect.top)/rect.height)*2-1);
 pointerHasMoved=true;
}
renderer.domElement.addEventListener("pointerdown",e=>{updateAim(e);});
renderer.domElement.addEventListener("pointermove",updateAim);
renderer.domElement.addEventListener("pointercancel",()=>{pointerHasMoved=false;});
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(loaded){
 // PlayerController.Update(): left takes precedence, then Body.Move(direction).
 let dir=0;
 if(keys.left)dir=-1;else if(keys.right)dir=1;
 if(dir!==0)acceleration=dir;
 fixedAccumulator+=dt;
 while(fixedAccumulator>=.02){
  const step=.02;
  // Direct port of CharacterBody.FixedUpdate() for the recovered Operator prefab.
  if(acceleration!==0){
   const moveDir=Math.sign(acceleration);
   const movingAgainstFacing=moveDir!==facingDirection;
   const crippled=false; // The recovered runtime has not ported physiology/crippling.
   let targetSpeed=1.5; // Operator.prefab walkSpeed
   if(keys.sprint&&!movingAgainstFacing&&!crippled)targetSpeed=4.2; // Operator.prefab sprintSpeed
   const speed=Math.abs(velocity);
   if(!(speed>targetSpeed)){
    const speedDifference=targetSpeed-speed;
    const forceX=speedDifference*moveDir*step*750; // AddForce(..., ForceMode.Acceleration)
    velocity+=forceX*step;
    acceleration=0; // ResetAcceleration(), exactly as the recovered source does
   }
  }
  // CharacterBody's Rigidbody has no drag; do not add invented release deceleration.
  playerX+=velocity*step;
  fixedAccumulator-=step;
 }
 character.position.x=playerX;
 // WeaponPointer.Update(): move the AimQuad from the operator, raycast the pointer against
 // that collider, retain its body-local hit point, then reconstruct WorldPoint from the body.
 if(aimQuad){
  aimQuad.position.set(playerX+facingDirection*20,2.5,-1.5);
  if(pointerHasMoved){
   character.updateMatrixWorld(true);aimQuad.updateMatrixWorld(true);camera.updateMatrixWorld(true);
   aimRaycaster.setFromCamera(pointerNdc,camera);
   const hit=aimRaycaster.intersectObject(aimQuad,false)[0];
   if(hit)localAimPoint.copy(character.worldToLocal(hit.point.clone()));
  }
  character.updateMatrixWorld(true);
  const worldPoint=character.localToWorld(localAimPoint.clone());
  if(rightUpperArm){
   rightUpperArm.updateWorldMatrix(true,false);
   const shoulder=rightUpperArm.getWorldPosition(new THREE.Vector3());
   // PlayerController.HandleChangeDirection(): WorldPoint.x compared to RightUpperArm.x.
   if(worldPoint.x>=shoulder.x)facingDirection=1;else facingDirection=-1;
  }
  character.rotation.y=facingDirection<0?Math.PI:0;
  aimQuad.position.set(playerX+facingDirection*20,2.5,-1.5);
 }
 applyAnimation(dt);
 updateWeaponAim();
 if(keys.fire||firePressed)fireWeapon();
 camera.position.x+=(playerX-camera.position.x)*Math.min(1,5*dt);
 camera.position.y+=(2.6-camera.position.y)*Math.min(1,3*dt);camera.lookAt(camera.position.x,2.6,0);
 positionLabel.textContent="X "+playerX.toFixed(2)+" · speed "+Math.abs(velocity).toFixed(2)+" m/s"+(keys.sprint?" · sprint input":"");
 }renderer.render(scene,camera)}
requestAnimationFrame(frame);load();
</script>
