<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318"><title>Crisis Response — recovered scene hierarchy</title>
<style>
:root{color-scheme:dark;font:14px system-ui,-apple-system,sans-serif;background:#101318;color:#edf0f5}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;padding:14px;background:#151a22;border-bottom:1px solid #414854}h1{font-size:17px;margin:0 0 5px}.muted{color:#aeb9c7;font-size:12px;line-height:1.5}input,select,button{font:inherit;color:inherit;background:#202834;border:1px solid #4a5667;border-radius:8px;padding:9px;min-height:38px}input{width:100%;margin:10px 0}#stats{margin:7px 0}main{padding:10px;max-width:1100px;margin:auto}.object{border:1px solid #333e4b;border-radius:9px;margin:7px 0;background:#171d26;overflow:hidden}.object summary{padding:11px;cursor:pointer;overflow-wrap:anywhere}.name{font-weight:700}.id{color:#9eacbc;font-size:11px}.details{padding:0 11px 12px;color:#c8d1dd;font-size:12px;line-height:1.55;overflow-wrap:anywhere}.pill{display:inline-block;border:1px solid #4a5667;border-radius:5px;padding:1px 5px;margin:2px;font-size:10px}.warn{color:#e7c48b}.tree{padding-left:14px}.empty{padding:20px;color:#c8d1dd}
</style></head><body>
<header><h1>Crisis Response — recovered scene hierarchy</h1><div class="muted">Marksman range · extracted from the original Unity scene serialization. This is inspection data, not a running game scene.</div>
<input id="search" type="search" placeholder="Filter by object or component name…" aria-label="Filter scene objects">
<div id="stats" class="muted">Loading scene manifest…</div></header>
<main><div id="results" class="empty">Loading recovered scene data…</div></main>
<script>
const stats=document.querySelector('#stats'),results=document.querySelector('#results'),search=document.querySelector('#search');let objects=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=search.value.trim().toLowerCase();const filtered=objects.filter(o=>(o.name||'').toLowerCase().includes(q)||o.componentDetails?.some(c=>(c.className||'').toLowerCase().includes(q)||(c.script?.path||'').toLowerCase().includes(q)));stats.textContent=objects.length.toLocaleString()+' original scene objects · '+filtered.length.toLocaleString()+' match · filtered by object/component/script';if(!filtered.length){results.innerHTML='<div class="empty">No matching objects.</div>';return}results.innerHTML=filtered.slice(0,700).map(o=>{const t=o.transform;const pos=t?.localPosition;const comps=o.componentDetails||[];return '<details class="object"><summary><span class="name">'+esc(o.name||'(unnamed object)')+'</span> <span class="id">#'+esc(o.fileID)+'</span><div>'+comps.map(c=>'<span class="pill">'+esc(c.className)+'</span>').join('')+'</div></summary><div class="details"><div><b>GameObject file ID:</b> '+esc(o.fileID)+'</div><div><b>Parent GameObject:</b> '+esc(o.parentGameObjectFileID??'scene root')+'</div><div><b>Local position:</b> '+esc(pos?pos.map(n=>Number(n).toFixed(3)).join(', '):'not available')+'</div><div><b>Components:</b> '+(comps.length?comps.map(c=>esc(c.className)+(c.script?.path?' — '+esc(c.script.path):'')+(c.mesh?.path?' — mesh '+esc(c.mesh.path):'')).join('<br>'):'none recorded')+'</div></div></details>'}).join('');if(filtered.length>700)results.insertAdjacentHTML('beforeend','<div class="empty">Showing first 700 matches. Narrow the filter to inspect more.</div>')}
search.addEventListener('input',render);
fetch('./scene-data/marksman-range.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{objects=data.gameObjects||[];stats.textContent='Loaded '+objects.length.toLocaleString()+' objects';render()}).catch(e=>{stats.textContent='Scene manifest unavailable';results.innerHTML='<div class="empty warn">Could not load the recovered scene manifest: '+esc(e.message)+'. The CI scene-extraction workflow must complete once before this page can show data.</div>'});
</script></body></html>
